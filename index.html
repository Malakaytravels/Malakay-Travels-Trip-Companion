      : "<b>This tab is hidden from clients.</b> Changes here save only on this device — they do not change what clients see. To change the live version, deploy a new file to Netlify."}</p>
  </div>
  <div class="card">
    <p class="sub" style="margin-top:0">${U().setupNote}</p>
    <textarea id="json" spellcheck="false">${esc(JSON.stringify(trip,null,2))}</textarea>
    <div class="row">
      <button class="btn" id="save">${U().save}</button>
      <button class="btn ghost" id="reset">${U().reset}</button>
      <button class="btn ghost" id="copy">${U().copy}</button>
      <button class="btn ghost" id="lock">${U().hideTab}</button>
      <span id="savemsg" class="mono" style="font-size:12px;color:var(--reef-dim)"></span>
    </div>
    <div id="jsonerr"></div>
    <p class="note" style="margin-top:12px">${U().running}: ${APP_VERSION}. ${U().versionNote}</p>
  </div>`;
}

/* ---------------- render ---------------- */
function render(){
  /* Nothing can be drawn before the trip file has resolved. Several things
     call render() on their own schedule — the language switch, the service
     worker finding an update, weather arriving — and on a cold start any of
     them can win the race against the fetch. tripPhase() then read trip.meta
     on null, the view died mid-render, and the app fell back to the NOW tab.
     The loader calls render() again as soon as the trip is in hand. */
  if(!trip) return;
  renderTabs();
  if(tab === "setup" && !setupUnlocked) tab = "now";
  const v = $("#view");
  v.innerHTML = ({now:viewNow,days:viewDays,flights:viewFlights,stay:viewStay,docs:viewDocs,gear:viewGear,log:viewLog,passport:viewPassport,map:viewMap,guide:viewGuide,setup:viewSetup})[tab]();
  if(tab === "map") setTimeout(drawMap, 30);
  if(tab === "now" || tab === "days"){
    const w = weatherPlace();
    if(w?.coords) getWeather(w.coords[0], w.coords[1]);
  }
  band();
}

/* CARTO began requiring an API key on its raster basemaps in late August 2026.
   Without one the tiles still load, but arrive with "API KEY REQUIRED" burned
   diagonally across them. The key is free (fair use 5m tiles/month), and it
   ships in the page like any other front-end key — restrict it to our own
   domains in the CARTO dashboard rather than treating it as a secret.
   Paste the key between the quotes. Left empty, the map still works; it just
   carries the watermark. */
const CARTO_KEY = "cb1_3mer_1_0727111f2027f0443f8b7023";

/* CARTO's keyed raster tiles sit under /rastertiles/<style>/, which is not
   where the old keyless light_all tiles lived. Appending a key to the old
   path fails every tile, which in turn trips the offline treatment and the
   map goes dark. Style options: "voyager" (CARTO's documented default),
   "light_all" (flatter, closer to our cream), "dark_all". Change one word. */
const CARTO_STYLE = "voyager";

function tileUrl(){
  const base = "https://{s}.basemaps.cartocdn.com/rastertiles/" + CARTO_STYLE
             + "/{z}/{x}/{y}{r}.png";
  return CARTO_KEY ? base + "?key=" + encodeURIComponent(CARTO_KEY) : base;
}

/* ---- Offline coastline ----------------------------------------------------
   Tiles come from CARTO and need a connection. Without them the map was a
   dark rectangle with coloured dots on it — true, but useless on a boat.
   land.json holds simplified OpenStreetMap coastlines for the whole world,
   every ring prefixed by its bounding box so we can pick out the handful in
   view without touching the rest. Loaded once, cached by the service worker,
   and drawn only when tiles fail. Not street level: land, sea, islands. */
let LAND = null, landLayer = null, landPending = null;

/* land.bin, little-endian:
     uint32 version, uint32 ringCount
     ringCount × [ float32 minx,miny,maxx,maxy | uint32 offset | uint32 nPts ]
     float32 coordinate pairs
   Read as typed arrays and left that way. The earlier JSON version parsed
   into 63,000 JavaScript arrays and crashed Safari on the phone; typed
   arrays keep it at roughly the size of the file. */
/* Master switch. The coastline is an enhancement — if it misbehaves the map
   must still work, so it can be turned off in one word without unpicking
   anything. false = dark fallback only, exactly as v45 behaved. */
const LAND_ENABLED = true;

function loadLand(){
  if(!LAND_ENABLED) return Promise.reject(new Error("land disabled"));
  if(LAND) return Promise.resolve(LAND);
  if(landPending) return landPending;
  landPending = fetch("land.bin")
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error("land " + r.status)))
    .then(buf => {
      const head = new Uint32Array(buf, 0, 2);
      const count = head[1];
      const idxBytes = count * 24;
      LAND = {
        count: count,
        bbox: new Float32Array(buf, 8, count * 6),            /* read as floats */
        meta: new Uint32Array(buf, 8, count * 6),             /* same bytes, as ints */
        xy:   new Float32Array(buf, 8 + idxBytes)
      };
      return LAND;
    })
    .catch(e => { landPending = null; throw e; });
  return landPending;
}

/* Redraw the coastline for whatever is on screen. Called on every pan and
   zoom while offline; the bbox test is four numeric comparisons per ring,
   so scanning all of them costs less than drawing even one extra island. */
function drawLand(){
  if(!map || !LAND) return;
  /* Draw well beyond the screen. Leaflet pans and zooms the layer we already
     made, so a generous margin means an animation has land under it the whole
     way without recomputing anything mid-flight. */
  const b = map.getBounds().pad(1.5);
  const w = b.getWest(), e = b.getEast(), s2 = b.getSouth(), n = b.getNorth();
  const span = Math.max(e - w, n - s2);
  const minSize = span * 0.004;
  const step = span > 40 ? 8 : span > 12 ? 4 : span > 3 ? 2 : 1;
  const bb = LAND.bbox, mt = LAND.meta, xy = LAND.xy;
  const polys = [];
  let budget = 18000;
  for(let i = 0; i < LAND.count && budget > 0; i++){
    const o = i * 6;
    const x0 = bb[o], y0 = bb[o+1], x1 = bb[o+2], y1 = bb[o+3];
    if(x0 > e || x1 < w || y0 > n || y1 < s2) continue;
    if((x1 - x0) < minSize && (y1 - y0) < minSize) continue;
    const start = mt[o+4], nPts = mt[o+5];
    /* A single big coastline — Palawan, Luzon — can carry tens of thousands
       of points on its own, so thin per ring as well as per zoom. */
    const rStep = step * Math.max(1, Math.ceil(nPts / 2500));
    const pts = [];
    for(let k = 0; k < nPts; k += rStep){
      const p = (start + k) * 2;
      pts.push([xy[p+1], xy[p]]);            /* lat, lng */
    }
    if(pts.length < 3) continue;
    pts.push(pts[0]);
    budget -= pts.length;
    polys.push(pts);
  }
  /* Reuse the layer. Removing and re-adding it churned canvas objects hard
     enough to crash Safari; setLatLngs swaps the geometry in place. */
  if(landLayer){
    landLayer.setLatLngs(polys);
  }else{
    landLayer = L.polygon(polys, {
      stroke:true, color:"#1B5566", weight:0.7,
      fill:true, fillColor:"#0B2C38", fillOpacity:1,
      interactive:false, pane:"land", renderer: L.canvas({pane:"land"})
    }).addTo(map);
  }
  landLayer.bringToBack();
}

/* Redraw while the map is still moving, not only when it settles. The replay
   animation pans and zooms for several seconds; binding to moveend alone left
   the coastline drawn for the first frame and black until the plane landed.
   One redraw per animation frame at most, so a long flight stays smooth. */
let landTimer = 0;
function drawLandSoon(){
  if(landTimer) clearTimeout(landTimer);
  landTimer = setTimeout(() => { landTimer = 0; drawLand(); }, 300);
}

function landOn(){
  loadLand().then(() => {
    drawLand();
    /* Only when the map has settled. The layer moves with the map on its own
       during a pan or a replay, so recomputing mid-animation bought nothing
       and cost enough memory to crash the phone. */
    map.on("moveend zoomend", drawLandSoon);
  }).catch(() => {});   /* no land file: the dark fallback still stands */
}

function landOff(){
  if(!map) return;
  map.off("moveend zoomend", drawLandSoon);
  if(landTimer){ clearTimeout(landTimer); landTimer = 0; }
  if(landLayer){ map.removeLayer(landLayer); landLayer = null; }
}

function mapOfflineNote(on){
  let n = document.getElementById("mapOfflineNote");
  if(!n){
    const box = document.getElementById("map");
    if(!box) return;
    n = document.createElement("div");
    n.id = "mapOfflineNote";
    n.className = "map-offline-note";
    n.innerHTML = '<span class="dot"></span><span></span>';
    box.insertAdjacentElement("afterend", n);
  }
  n.querySelector("span:last-child").textContent = mapSave ? U().off.mapOfflineSaved : U().mapOffline;
  n.classList.toggle("on", !!on);
}

/* ---- Offline map ---------------------------------------------------------
   The service worker keeps CARTO tiles in their own cache, stamped, for at
   most 30 days — the limit in CARTO's basemap terms. "Save map" fetches the
   tiles for this trip ahead of time: a world view for the fly-in, the trip
   region, and street level around every hotel, town and airport (dive
   sites stop at z13 — there are no streets at sea). Names must match sw.js. */
const TILE_CACHE = "malakay-tiles";
const TILE_MAX_AGE_DAYS = 30;
let mapSave = null;        // {at, count, bytes} for this trip, once saved
let mapSaving = null;      // {done, total, failed} while a save is running

function lon2tile(lng, z){ return Math.floor((lng + 180) / 360 * 2 ** z); }
function lat2tile(lat, z){
  const r = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z);
}

function tripTiles(){
  const set = new Set();
  const add = (z, x, y) => { if(x >= 0 && y >= 0 && x < 2 ** z && y < 2 ** z) set.add(z + "/" + x + "/" + y); };
  /* The fly-in from Warsaw crosses half the world at z2–3. */
  for(let z = 2; z <= 3; z++) for(let x = 0; x < 2 ** z; x++) for(let y = 0; y < 2 ** z; y++) add(z, x, y);
  /* Region: the hotels frame the trip. Places can include Warsaw, which
     would stretch the box across a continent. */
  const hc = trip.hotels.map(h => h.coords).filter(Boolean);
  if(hc.length){
    let n = Math.max(...hc.map(c => c[0])), s = Math.min(...hc.map(c => c[0]));
    let e = Math.max(...hc.map(c => c[1])), w = Math.min(...hc.map(c => c[1]));
    const pl = (n - s) * .15 + .3, pg = (e - w) * .15 + .3;
    n += pl; s -= pl; e += pg; w -= pg;
    for(let z = 4; z <= 10; z++){
      const x0 = lon2tile(w, z), x1 = lon2tile(e, z), y0 = lat2tile(n, z), y1 = lat2tile(s, z);
      if((x1 - x0 + 1) * (y1 - y0 + 1) > 400) continue;
      for(let x = x0; x <= x1; x++) for(let y = y0; y <= y1; y++) add(z, x, y);
    }
  }
  const stops = trip.hotels.map(h => ({c: h.coords, type: "hotel"}))
    .concat(trip.places.map(p => ({c: p.coords, type: p.type})));
  stops.forEach(st => {
    if(!st.c) return;
    const top = st.type === "dive" ? 13 : 15;
    for(let z = 11; z <= top; z++){
      const cx = lon2tile(st.c[1], z), cy = lat2tile(st.c[0], z);
      for(let dx = -1; dx <= 1; dx++) for(let dy = -1; dy <= 1; dy++) add(z, cx + dx, cy + dy);
    }
  });
  /* Exactly what Leaflet will ask for, so the service worker finds it. */
  const r = (window.L && L.Browser.retina) ? "@2x" : "";
  const base = tileUrl();
  return [...set].map(k => {
    const [z, x, y] = k.split("/");
    return base.replace("{s}", "a").replace("{z}", z).replace("{x}", x).replace("{y}", y).replace("{r}", r);
  });
}

async function loadMapSave(){
  try{
    const v = await window.storage.get(K("offlineMap"));
    mapSave = JSON.parse(v.value);
  }catch(e){ mapSave = null; }
  if(mapSave && mapExpiry() <= new Date()) mapSave = null;
}
function mapExpiry(){
  return mapSave ? new Date(mapSave.at + TILE_MAX_AGE_DAYS * 864e5) : null;
}

async function saveMapOffline(){
  if(mapSaving || !navigator.onLine) return;
  const urls = tripTiles();
  mapSaving = { done: 0, total: urls.length, failed: 0 };
  refreshOfflineUI();
  /* Ask the browser not to clear our storage when the phone runs low. */
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const viaWorker = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  const c = await caches.open(TILE_CACHE);
  let bytes = 0, i = 0;
  const one = async (u) => {
    try{
      /* With the service worker in charge it stores the tile itself. On the
         very first visit it is not in charge yet, so store it here. */
      const res = await fetch(u, { mode: "cors", credentials: "omit" });
      if(!res.ok) throw new Error(res.status);
      const blob = await res.blob();
      bytes += blob.size;
      if(!viaWorker){
        const headers = new Headers(res.headers);
        headers.set("x-malakay-saved", String(Date.now()));
        await c.put("https://a.basemaps.cartocdn.com" + new URL(u).pathname + new URL(u).search,
          new Response(blob, { status: 200, headers }));
      }
    }catch(e){ mapSaving.failed++; }
    mapSaving.done++;
  };
  const worker = async () => { while(i < urls.length){ await one(urls[i++]); updateMapProgress(); } };
  await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
  const ok = mapSaving.done - mapSaving.failed;
  /* Most tiles in: good enough — a stray missing tile falls back to the
     coastline. Mostly failures means the provider refused or signal died. */
  if(ok >= mapSaving.total * 0.9){
    mapSave = { at: Date.now(), count: ok, bytes };
    try{ await window.storage.set(K("offlineMap"), JSON.stringify(mapSave)); }catch(e){}
    mapSaving = null;
  } else {
    mapSaving = { ...mapSaving, error: true };
  }
  refreshOfflineUI();
  checkOffline();
}

function updateMapProgress(){
  if(!mapSaving) return;
  document.querySelectorAll("[data-mapprog]").forEach(el => {
    el.style.width = Math.round(mapSaving.done / mapSaving.total * 100) + "%";
  });
  document.querySelectorAll("[data-mapcount]").forEach(el => {
    el.textContent = `${mapSaving.done} / ${mapSaving.total}`;
  });
}

function fmtMB(b){ return (b / 1048576).toFixed(b > 10485760 ? 0 : 1) + " MB"; }
function fmtShort(d){ return d.toLocaleDateString(lang === "pl" ? "pl-PL" : "en-GB", {day:"numeric", month:"short"}); }

/* Status line + action for the offline map. Shared by NOW and MAP. */
function mapSaveRow(){
  const O = U().off;
  if(mapSaving && !mapSaving.error){
    return { done: false, sub: `${O.mapSaving} <span class="mono" data-mapcount>${mapSaving.done} / ${mapSaving.total}</span>`,
      extra: `<div class="prog" style="margin-top:8px"><i data-mapprog style="width:${Math.round(mapSaving.done/mapSaving.total*100)}%"></i></div>`,
      action: "" };
  }
  if(mapSaving && mapSaving.error){
    return { done: false, sub: navigator.onLine ? O.mapFailed : O.mapNeedsSignal,
      action: navigator.onLine ? `<button class="btn" data-savemap="1">${O.tryAgain}</button>` : "" };
  }
  /* One save covers 30 days. Only a copy that lasts to the last day of the
     trip counts as done; otherwise say when a save would last. */
  const end = dateOnly(trip.meta.end);
  const bestFrom = new Date(end.getTime() - (TILE_MAX_AGE_DAYS - 1) * 864e5);
  const early = new Date() < bestFrom;
  const when = early ? `<br><b>${O.saveAgainFrom} ${fmtShort(bestFrom)}</b> ${O.saveAgainWhy}` : "";
  if(mapSave){
    const exp = mapExpiry();
    const lapses = exp < end;
    return { done: !lapses,
      sub: `${O.mapSaved} ${fmtShort(new Date(mapSave.at))} · ${fmtMB(mapSave.bytes)} · ${O.keptUntil} ${fmtShort(exp)}`
        + (lapses ? when || `<br>${O.saveAgainNow}` : ""),
      action: lapses && !early && navigator.onLine ? `<button class="btn" data-savemap="1">${O.saveAgain}</button>` : "" };
  }
  return { done: false, sub: (navigator.onLine ? O.mapNotSaved : O.mapNeedsSignal) + (navigator.onLine ? when : ""),
    action: navigator.onLine ? `<button class="btn ${early?"ghost":""}" data-savemap="1">${O.saveMap}</button>` : "" };
}

/* ---- Ready for no signal -------------------------------------------------
   What a client needs on the phone before they lose signal, checked for
   real where the app can check it, ticked by hand where it cannot. */
let offlineStatus = { trip: false, at: null };
let gmapsDone = false;

async function checkOffline(){
  let tripOk = false;
  try{
    tripOk = !!(navigator.serviceWorker && navigator.serviceWorker.controller)
      && !!(await caches.match("trips/" + TRIP_ID + ".json"))
      && !!(await caches.match("index.html"));
  }catch(e){}
  let at = null;
  try{ at = Number((await window.storage.get(K("tripFetchedAt"))).value) || null; }catch(e){}
  try{ gmapsDone = (await window.storage.get(K("gmapsOffline"))).value === "1"; }catch(e){ gmapsDone = false; }
  const changed = tripOk !== offlineStatus.trip || at !== offlineStatus.at;
  offlineStatus = { trip: tripOk, at };
  if(changed && tab === "now") render();
}

function offlineBlock(){
  const p = tripPhase();
  if(p.phase === "after") return "";
  const O = U().off;
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const m = mapSaveRow();
  const hc = trip.hotels.map(h => h.coords).filter(Boolean);
  const mid = hc.length
    ? [hc.reduce((a, c) => a + c[0], 0) / hc.length, hc.reduce((a, c) => a + c[1], 0) / hc.length]
    : null;
  const rows = [
    { done: !!standalone, title: O.homeTitle,
      sub: standalone ? O.homeDone : (/iPad|iPhone|iPod/.test(navigator.userAgent) ? O.homeIos : O.homeOther) },
    { done: offlineStatus.trip, title: O.tripTitle,
      sub: offlineStatus.trip
        ? (offlineStatus.at ? `${O.tripUpdated} ${new Date(offlineStatus.at).toLocaleString(lang==="pl"?"pl-PL":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : O.tripSaved)
        : O.tripNotYet },
    { done: m.done, title: O.mapTitle, sub: m.sub, extra: m.extra || "", action: m.action },
    { done: gmapsDone, title: O.gmapsTitle, sub: O.gmapsHow,
      action: `${mid && !gmapsDone ? `<a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/@${mid[0].toFixed(3)},${mid[1].toFixed(3)},9z">${O.openGmaps}</a>` : ""}
        <button class="btn ${gmapsDone?"ghost":""}" data-gmaps="1" aria-pressed="${gmapsDone}">${gmapsDone ? O.undo : O.markDone}</button>` }
  ];
  const n = rows.filter(r => r.done).length;
  const all = n === rows.length;
  return `<div class="card offcard">
    <div class="hd"><div><div class="eyebrow">${O.eyebrow}</div>
      <h3 style="margin-top:4px">${all ? O.allReady : `${n} / ${rows.length} ${U().ready}`}</h3>
      <p class="sub">${all ? O.allReadySub : O.intro}</p></div>
      <span class="pill ${all?"ok":""}">${all ? "✓ Offline" : "Offline"}</span></div>
    <div class="prog" style="margin-top:12px"><i style="width:${Math.round(n/rows.length*100)}%"></i></div>
    <ol class="offlist">${rows.map(r => `<li class="${r.done?"done":""}">
      <span class="tick" aria-hidden="true">${r.done ? "✓" : ""}</span>
      <div class="ob"><div class="ot">${r.title}<span class="sr">${r.done ? " — " + O.doneWord : ""}</span></div>
        <div class="os">${r.sub}</div>${r.extra || ""}
        ${r.action ? `<div class="row">${r.action}</div>` : ""}</div></li>`).join("")}</ol>
  </div>`;
}

/* Pin names for the offline map. Without tiles there are no place names at
   all, so the pins carry their own. Hotels always — they are where the
   route stops; everything else once zoomed in, or the overview is a pile
   of overlapping labels. */
let mapMarkers = [];
function pinLabels(on){
  mapMarkers.forEach(m => {
    if(on && !m.mk.getTooltip()){
      m.mk.bindTooltip(esc(m.name), { permanent: true, direction: "right", offset: [8, 0],
        className: "mklabel mklabel-" + m.type, interactive: false });
    } else if(!on && m.mk.getTooltip()){
      m.mk.unbindTooltip();
    }
  });
  zoomClass();
}
function zoomClass(){
  const box = document.getElementById("map");
  if(box && map) box.classList.toggle("zoomed-in", map.getZoom() >= 11);
}

function drawMap(){
  const box = document.getElementById("map"); if(!box) return;
  clearIntro();
  /* Leaflet is served from our own origin and precached, so this should not
     happen — but if the file is ever missing the tab must degrade, not throw. */
  if(!window.L){
    box.innerHTML = '<p class="note" style="padding:16px">' + U().mapUnavailable + '</p>';
    return;
  }
  if(map){ landOff(); map.remove(); map = null; }
  landLayer = null;
  box.classList.remove("tiles-offline");
  mapOfflineNote(false);
  map = L.map(box,{scrollWheelZoom:false});
  /* The offline coastline sits beneath the tiles, so a saved map covers it
     and any tile that was not saved shows land and sea instead of a hole. */
  map.createPane("land").style.zIndex = 150;
  map.on("zoomend", zoomClass);
  const tiles = L.tileLayer(tileUrl(),
    {attribution:"© OpenStreetMap, © CARTO", subdomains:"abcd", maxZoom:20}).addTo(map);
  const goOffline = () => {
    if(box.classList.contains("tiles-offline")) return;
    box.classList.add("tiles-offline"); mapOfflineNote(true); landOn(); pinLabels(true);
  };
  /* A single failed tile is routine — a CDN hiccup, a tile that does not exist
     at that zoom. Only treat the map as offline when the browser says we are
     offline, or when several tiles in a row fail and none has ever arrived.
     Flipping on one error meant a momentary glitch pulled in the whole
     coastline and redrew it over a perfectly good map. */
  let tileOk = 0, tileFail = 0;
  tiles.on("tileerror", () => {
    tileFail++;
    if(navigator.onLine === false || (tileOk === 0 && tileFail >= 6)) goOffline();
  });
  tiles.on("tileload", () => {
    tileOk++; tileFail = 0;
    /* A saved tile loads fine with no signal — that is not "back online". */
    if(navigator.onLine && box.classList.contains("tiles-offline")){
      box.classList.remove("tiles-offline"); mapOfflineNote(false); landOff(); pinLabels(false);
    }
  });

  const pts = [], markers = [];
  mapMarkers = markers;
  const add = (name,type,coords,note,addr,pid) => {
    pts.push(coords);
    const href = mapsUrl(name, addr, coords, pid);
    const mk = L.marker(coords,{icon:L.divIcon({className:"",html:`<div class="mk ${type}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})})
      .addTo(map).bindPopup(
        `<b>${esc(name)}</b><br>${esc(note||"")}`
        + `<br><a href="${href}" target="_blank" rel="noopener">${U().openInMaps}</a>`);
    markers.push({coords, mk, name, type});
  };
  trip.places.forEach(p => add(p.name,p.type,p.coords,tr(p.note),p.address,p.placeId));
  trip.hotels.forEach(h => add(h.name,"hotel",h.coords,`${tr(h.place)} · ${daysBetween(h.checkIn,h.checkOut)} ${U().nights}`,h.address,h.placeId));

  const route = trip.hotels.map(h=>h.coords);
  if(route.length>1) L.polyline(route,{color:"#0E3346",weight:2,opacity:.5,dashArray:"5,6"}).addTo(map);

  if(navigator.onLine === false) goOffline();

  if(focusPoint){
    // Arrived here from a hotel or a day — zoom in and open that pin.
    const [flat,flng] = focusPoint;
    map.setView(focusPoint, 13);
    let best = null, bestD = Infinity;
    markers.forEach(m => {
      const d = Math.abs(m.coords[0]-flat) + Math.abs(m.coords[1]-flng);
      if(d < bestD){ bestD = d; best = m; }
    });
    if(best && bestD < 0.05) best.mk.openPopup();
    focusPoint = null;
  } else {
    const dest = L.latLngBounds(pts).pad(0.12);
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(still) map.fitBounds(dest);
    else flyFromWarsaw(map, box, dest);
  }
}

/* The trip starts in Warsaw. Opening the map replays that: it settles over
   Poland, flies the route east, then hands over to the Philippines view. */
const WAW = [52.1657, 20.9671];               // Chopin airport
let introUnbind = null;   // detaches the running intro's skip handlers
function clearIntro(){
  if(introRaf) cancelAnimationFrame(introRaf), introRaf = null;
  if(introTimer) clearTimeout(introTimer), introTimer = null;
  if(introUnbind) introUnbind(), introUnbind = null;
}
function toXYZ(p){
  const a = p[0]*Math.PI/180, b = p[1]*Math.PI/180;
  return [Math.cos(a)*Math.cos(b), Math.cos(a)*Math.sin(b), Math.sin(a)];
}
function greatCircle(p, q, f){        // slerp — the arc a plane actually flies
  const A = toXYZ(p), B = toXYZ(q);
  const dot = Math.min(1, Math.max(-1, A[0]*B[0]+A[1]*B[1]+A[2]*B[2]));
  const w = Math.acos(dot);
  if(w < 1e-9) return p;
  const s1 = Math.sin((1-f)*w)/Math.sin(w), s2 = Math.sin(f*w)/Math.sin(w);
  const x = A[0]*s1+B[0]*s2, y = A[1]*s1+B[1]*s2, z = A[2]*s1+B[2]*s2;
  return [Math.atan2(z, Math.hypot(x,y))*180/Math.PI, Math.atan2(y,x)*180/Math.PI];
}
function bearing(p, q){
  const f1 = p[0]*Math.PI/180, f2 = q[0]*Math.PI/180, dl = (q[1]-p[1])*Math.PI/180;
  return Math.atan2(Math.sin(dl)*Math.cos(f2),
    Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))*180/Math.PI;
}

function flyFromWarsaw(map, box, dest){
  clearIntro();
  const end = [dest.getCenter().lat, dest.getCenter().lng];
  const arc = [];
  for(let i=0;i<=64;i++) arc.push(greatCircle(WAW, end, i/64));

  const line = L.polyline(arc,{color:"#17B8AE",weight:2,opacity:.75,dashArray:"6,7"}).addTo(map);
  const plane = L.marker(WAW,{interactive:false,icon:L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,13],
    html:`<div class="plane"><svg width="26" height="26" viewBox="0 0 24 24" fill="#DFC45D">
      <path d="M12 2c.62 0 1.05.92 1.05 2.05V9.6l8 4.72v1.98l-8-2.4v4.62l2.95 2v1.55L12 21.1l-4 .97V20.5l2.95-2v-4.62l-8 2.4v-1.98l8-4.72V4.05C10.95 2.92 11.38 2 12 2z"/></svg></div>`})}).addTo(map);

  const cap = document.createElement("div");
  cap.className = "mapcap";
  cap.innerHTML = `<span>${esc(introRoute())}</span><i>${U().skipIntro}</i>`;
  box.appendChild(cap);
  requestAnimationFrame(()=>cap.classList.add("on"));

  let done = false;
  const unbind = () => { map.off("moveend", finish); box.removeEventListener("pointerdown", finish); };
  const finish = () => {
    if(done) return; done = true;
    introUnbind = null;
    clearIntro();
    unbind();
    try{ map.removeLayer(line); map.removeLayer(plane); }catch(e){}
    cap.classList.remove("on");
    setTimeout(()=>cap.remove(), 500);
    map.fitBounds(dest);
  };
  box.addEventListener("pointerdown", finish, {once:true});
  /* If the map is rebuilt before the intro ends, the old handlers must not
     fire on the old, removed map. */
  introUnbind = () => { done = true; unbind(); };

  map.setView(WAW, 5);
  introTimer = setTimeout(()=>{
    if(done) return;
    const t0 = performance.now(), DUR = 4200;
    map.flyToBounds(dest, {duration: DUR/1000, easeLinearity:.28});
    map.once("moveend", finish);
    const step = (now) => {
      if(done) return;
      const f = Math.min(1, (now - t0)/DUR);
      const at = greatCircle(WAW, end, f);
      const ahead = greatCircle(WAW, end, Math.min(1, f + 0.02));
      plane.setLatLng(at);
      const el = plane.getElement()?.querySelector(".plane");
      if(el) el.style.transform = `rotate(${bearing(at, ahead)}deg)`;
      if(f < 1) introRaf = requestAnimationFrame(step);
    };
    introRaf = requestAnimationFrame(step);
  }, 850);
}

document.addEventListener("click", async (e) => {
  /* passport navigation */
  const ppBtn = e.target.closest("[data-pp]");
  if(ppBtn){ ppOpen = ppBtn.getAttribute("data-pp"); render(); return; }
  if(e.target.closest("[data-ppback]")){ ppOpen = null; render(); return; }
  if(e.target.closest("#pp-export")){ await ppExport(); return; }
  if(e.target.closest("#pp-import")){ const f = document.getElementById("pp-file"); if(f) f.click(); return; }
  const t = e.target.closest("[data-pp],[data-ppback],#pp-export,#pp-import,[data-rename],[data-lang],[data-tab],[data-goto],[data-day],[data-dmode],[data-savemap],[data-gmaps],[data-add],[data-view],[data-del],[data-fgroup],[data-gear],[data-ggroup],[data-dvedit],[data-dvdel],#dv-new,#dv-save,#dv-cancel,#showall,#installbtn,#save,#reset,#copy,#lock");
  if(!t) return;

  if(t.dataset.rename){ openGate(); return; }
  if(t.dataset.lang){ setLang(t.dataset.lang); return; }

  if(t.dataset.tab || t.dataset.goto){
    if(t.dataset.focus) focusPoint = t.dataset.focus.split(",").map(Number);
    tab = t.dataset.tab || t.dataset.goto; window.scrollTo(0,0); render(); return;
  }

  if(t.dataset.add){
    const p = $("#picker");
    p.dataset.slot = t.dataset.add;
    p.value = "";
    p.click();
    return;
  }
  if(t.id === "showall"){ focusPoint = null; drawMap(); return; }
  if(t.id === "installbtn"){ doInstall(); return; }
  if(t.dataset.view){ openDoc(t.dataset.view); return; }
  if(t.dataset.del){
    const slot = trip.documents.wallet.find(s=>s.id===t.dataset.del);
    if(confirm(`${U().removeConfirm} ${slot ? tr(slot.label).toLowerCase() : "?"}${U().removeConfirm2}`)) removeDoc(t.dataset.del);
    return;
  }

  if(t.dataset.savemap){ saveMapOffline(); return; }
  if(t.dataset.gmaps){
    gmapsDone = !gmapsDone;
    try{ await window.storage.set(K("gmapsOffline"), gmapsDone ? "1" : "0"); }catch(e){}
    render(); return;
  }
  if(t.dataset.dmode){
    if(daysMode !== t.dataset.dmode){ daysMode = t.dataset.dmode; render(); }
    return;
  }
  if(t.dataset.day){
    const b = document.getElementById("dbody-"+t.dataset.day);
    const open = b.classList.toggle("hidden");
    t.setAttribute("aria-expanded", String(!open));
    return;
  }
  if(t.id === "dv-new"){ newDive(); return; }
  if(t.id === "dv-save"){ saveDive(); return; }
  if(t.id === "dv-cancel"){ editingDive = null; render(); return; }
  if(t.dataset.dvedit){ editDive(t.dataset.dvedit); return; }
  if(t.dataset.dvdel){ if(confirm(U().deleteDive)) deleteDive(t.dataset.dvdel); return; }
  if(t.dataset.gear){ toggleGear(t.dataset.gear); return; }
  if(t.dataset.ggroup !== undefined){ const g = +t.dataset.ggroup; openGearGroup = (openGearGroup===g ? -1 : g); render(); return; }
  if(t.dataset.fgroup !== undefined){ const g = +t.dataset.fgroup; openFactGroup = (openFactGroup===g ? -1 : g); render(); return; }

  if(t.id === "save"){
    try{
      const parsed = JSON.parse($("#json").value);
      if(!parsed.meta || !Array.isArray(parsed.days)) throw new Error("Needs a meta object and a days array.");
      trip = parsed; wxKey = null; openFactGroup = 0;
      const ok = await saveTrip();
      render();
      $("#savemsg").textContent = ok ? U().savedDevice : U().savedSession;
    }catch(err){
      $("#jsonerr").innerHTML = `<div class="err">${U().jsonFail} ${esc(err.message)}</div>`;
    }
    return;
  }
  if(t.id === "lock"){
    if(!confirm(U().hideTabConfirm)) return;
    setupUnlocked = false;
    try{ await window.storage.set("malakay:setup","0"); }catch(e){}
    tab = "now"; window.scrollTo(0,0); render(); return;
  }
  if(t.id === "reset"){ trip = structuredClone(SEED); wxKey=null; openFactGroup=0; await saveTrip(); render(); return; }
  if(t.id === "copy"){
    try{ await navigator.clipboard.writeText($("#json").value); $("#savemsg").textContent = "OK"; }catch(err){}
    return;
  }
});

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.update();                                  // check on every launch
      setInterval(() => reg.update(), 60*60*1000);   // and hourly while open
    }).catch(()=>{});

  // A new version has taken control — reload once so the client sees it.

/* ---------------- traveller and flight set selection ----------------
   The traveller's link carries ?t=<contract number>. That resolves to
   their record, which names them and picks their flight set.

   ?f=<set> is still honoured on its own, so any link already sent out
   keeps working. Unknown or missing values fall back to "std", so a
   mistyped link shows a working app rather than an empty flights tab.

   Nothing here is a security control. The contract number is a lookup
   key into a file every traveller already has, not a password. */
let traveller = null;

function normContract(s){
  return String(s || "").replace(/\D/g, "");
}

function pickTraveller(){
  const sets  = trip.flightSets || {};
  const roll  = trip.travellers || {};
  let key = "std";
  traveller = null;

  try{
    const q = urlParams();

    const t = normContract(q.get("t"));
    if(t && Object.prototype.hasOwnProperty.call(roll, t)){
      traveller = roll[t];
      if(traveller.flights && Object.prototype.hasOwnProperty.call(sets, traveller.flights)){
        key = traveller.flights;
      }
    }

    /* ?f= wins only when no contract resolved, so an old link still works. */
    if(!traveller){
      const f = q.get("f");
      if(f && Object.prototype.hasOwnProperty.call(sets, f)) key = f;
    }
  }catch(e){}

  /* Older trip files (v31 and earlier) carry a flat flights array and no
     flightSets. Only overwrite when there is actually a set to use, or
     those trips would lose their flights entirely. */
  if(Object.keys(sets).length) trip.flights = sets[key] || sets.std || [];
  trip.flights = trip.flights || [];
  trip.meta = trip.meta || {};
  trip.meta.flightSet = key;
  trip.meta.contractRef = traveller ? traveller.ref : "";
}

/* ---------------- no-fly window ----------------
   Not a decompression calculation. It compares two timestamps the
   operator already knows against DAN's published minimum surface
   interval before flying. The diver's own computer always governs. */
function noFlyState(){
  const c = trip.meta && trip.meta.noFly;
  if(!c || !c.lastDive || !c.firstFlight) return null;
  const dive   = new Date(c.lastDive.replace(" ","T"));
  const flight = new Date(c.firstFlight.replace(" ","T"));
  if(isNaN(dive) || isNaN(flight)) return null;
  const hours = (flight - dive) / 3600000;
  if(hours <= 0) return null;
  const min = c.minHours || 18;
  return {
    hours: Math.round(hours * 10) / 10,
    long: hours >= 48,
    days: Math.floor(hours / 24),
    rem: Math.round(hours % 24),
    min,
    dive, flight,
    label: c.firstFlightLabel,
    level: hours < min ? "under" : (hours < min + 3 ? "tight" : "ok")
  };
}

function fmtWhen(d){
  return d.toLocaleDateString(lang === "pl" ? "pl-PL" : "en-GB",
    { day:"2-digit", month:"short" }) + " · " +
    String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0");
}

function noFlyCard(){
  const n = noFlyState();
  if(!n) return "";
  const U_ = U();
  const verdict = n.level === "under" ? U_.nfUnder
                : n.level === "tight" ? U_.nfTight
                : U_.nfOk;
  return `<div class="nofly ${n.level}">
    <h4>${U_.nfTitle}</h4>
    <div class="nofly-row"><span>${U_.nfLast}</span><span>${fmtWhen(n.dive)}</span></div>
    <div class="nofly-row"><span>${U_.nfFlight}${n.label ? " · " + esc(tr(n.label)) : ""}</span><span>${fmtWhen(n.flight)}</span></div>
    <div class="nofly-gap"><b>${n.long ? n.days + U_.nfDays + " " + n.rem + U_.nfHours : n.hours + U_.nfHours}</b><i>${U_.nfMin}: ${n.min}${U_.nfHours}</i></div>
    <div class="nofly-verdict">${verdict}</div>
    <p class="nofly-note">${U_.nfNote}</p>
  </div>`;
}

/* ---------------- first-run name step ---------------- */
function greetWord(){
  const h = new Date().getHours();
  /* Polish has no separate "good afternoon" — Dzien dobry covers the day. */
  return h >= 18 ? U().goodEvening : U().goodMorning;
}

/* Typing stays available even when we know the names on the contract.
   Contracts cover two people and phones get shared, so a hard list
   would lock out anyone the booking did not name. */
let gateTyping = false;

function gateNames(){
  return (traveller && Array.isArray(traveller.names)) ? traveller.names : [];
}

function paintGate(){
  const names = gateNames();
  const pick  = names.length > 0 && !gateTyping;

  $("#ng-ask").textContent   = pick ? U().nameAskPick  : U().nameAsk;
  $("#ng-help").textContent  = pick ? U().nameHelpPick : U().nameHelp;
  $("#ng-note").textContent  = U().nameNote;
  $("#ng-save").textContent  = U().nameSave;
  $("#ng-skip").textContent  = U().nameSkip;
  $("#ng-input").placeholder = U().namePh;

  const picks = $("#ng-picks");
  picks.classList.toggle("hidden", !pick);
  $("#ng-input").classList.toggle("hidden", pick);
  $("#ng-save").classList.toggle("hidden", pick);

  if(pick){
    picks.innerHTML =
      names.map((n,i) => `<button class="ng-pick${i===0?" nudge":""}" data-pick="${esc(n)}">`
        + `<span>${esc(n)}</span><span class="ng-arrow">&rarr;</span></button>`).join("")
      + `<button class="ng-other" id="ng-other">${U().nameOther}</button>`
      + (traveller && traveller.ref
          ? `<p class="ng-ref">${U().contractRef}: ${esc(traveller.ref)}</p>` : "");
  }else{
    picks.innerHTML = "";
  }
}

function openGate(){
  gateTyping = false;
  paintGate();
  $("#ng-input").value = travellerName;
  $("#namegate").classList.remove("hidden");
  if(gateNames().length === 0) setTimeout(() => $("#ng-input").focus(), 80);
}
function closeGate(){
  $("#namegate").classList.add("hidden");
}

async function commitName(v){
  await saveName(v);
  closeGate();
  render();
}

$("#ng-picks").addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if(pick){ commitName(pick.getAttribute("data-pick")); return; }
  if(e.target.closest("#ng-other")){
    gateTyping = true;
    paintGate();
    setTimeout(() => $("#ng-input").focus(), 60);
  }
});

$("#ng-save").addEventListener("click", () => commitName($("#ng-input").value));
$("#ng-skip").addEventListener("click", () => commitName(""));
$("#ng-input").addEventListener("keydown", e => {
  if(e.key === "Enter") commitName($("#ng-input").value);
});

/* ---------------- boot ---------------- */
(async function(){
  await loadLang();
  try{
    SEED = await fetchTrip();
  }catch(err){
    loadFailed(err);
    return;
  }
  trip = structuredClone(SEED);
  await loadName();
  await loadSetupFlag();
  await loadTrip();
  /* pickTraveller runs after loadTrip, not before: loadTrip replaces the
     whole trip object, so resolving the flight set first would be undone. */
  pickTraveller();
  await loadWallet();
  await loadGear();
  await loadLog();
  await loadPassport();
  await recordPassport();
  await loadMapSave();
  render();
  checkOffline();
  if(navigator.serviceWorker){
    navigator.serviceWorker.ready.then(reg => {
      checkOffline();
      /* Tiles past CARTO's 30-day limit go, even if the app was not updated. */
      try{ (navigator.serviceWorker.controller || reg.active).postMessage("sweep-tiles"); }catch(e){}
    }).catch(() => {});
  }
  offbar();
  setInterval(band, 1000);
  /* Asked once. Skipping is allowed — nobody should be locked out of
     their own documents because they will not type a name. */
  try{
    const seen = await window.storage.get("malakay:name");
    if(!seen || typeof seen.value !== "string") openGate();
  }catch(e){ openGate(); }
})();
