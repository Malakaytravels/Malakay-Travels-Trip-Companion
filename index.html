<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malakay Travels — Trip Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Malakay">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/fonts.css">

<style>
:root{
  --abyss:#071A24;
  --deep:#0E3346;
  --reef:#17B8AE;
  --reef-dim:#0F7E78;
  --slate:#F1EBDD;
  --slate-2:#E1D8C4;
  --card:#FBF7EE;
  --ink:#12212A;
  --muted:#5F6E76;
  --ochre:#B5762D;
  --gold:#DFC45D;
  --coral:#D8492B;
  --r:14px;
  --pad:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--slate);
  color:var(--ink);
  font-family:'Karla',system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{font-family:'Archivo',sans-serif;margin:0;letter-spacing:-.02em}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--reef-dim)}

/* ---------- instrument band (the signature) ---------- */
.instrument{
  background:var(--abyss);color:var(--slate);
  border-bottom:2px solid var(--reef-dim);
  padding:14px 0 0;
}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:'Archivo';font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand .mark{height:22px;width:auto;display:block}
.brand span{color:var(--gold)}
.brand{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.brand:hover .mark{transform:scale(1.06)}
.brand .mark{transition:transform .18s ease-out}
.brand:focus-visible{outline:2px solid var(--reef);outline-offset:4px;border-radius:6px}
.tripcode{font-family:'IBM Plex Mono';font-size:11px;color:#7F98A3;letter-spacing:.08em}

.readout{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin-top:12px;border-top:1px solid #1B3A48;
}
.cell{padding:10px 0 12px;border-right:1px solid #1B3A48}
.cell:last-child{border-right:none}
.cell .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:#6E8794;text-transform:uppercase}
.cell .v{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;color:var(--reef);margin-top:3px;line-height:1;font-variant-numeric:tabular-nums}
.cell .v small{font-size:11px;color:#8FA9B4;font-weight:400;margin-left:2px}
.cell.wide{grid-column:span 2}
.cell.wide .v{font-size:16px;color:var(--slate);letter-spacing:-.01em}

.langsw{display:flex;border:1px solid #24485A;border-radius:99px;overflow:hidden}
.langsw button{background:none;border:none;color:#7F98A3;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;letter-spacing:.1em;padding:4px 9px}
.langsw button[aria-pressed="true"]{background:var(--reef-dim);color:#fff}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--reef);margin-right:6px;vertical-align:middle;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- tabs ---------- */
.tabsbar{background:var(--abyss);position:sticky;top:0;z-index:500;border-bottom:1px solid #1B3A48}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--pad)}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;color:#7F98A3;padding:11px 13px 10px;white-space:nowrap;
  font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--slate);border-bottom-color:var(--reef)}
.tab:focus-visible{outline:2px solid var(--reef);outline-offset:-2px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--slate-2);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.card.flat{background:transparent;border-style:dashed}
.card h3{font-size:17px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hair{height:1px;background:var(--slate-2);margin:13px -16px}
section{padding-top:6px}
.sectitle{display:flex;align-items:center;gap:10px;margin:22px 0 2px}
.sectitle h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.sectitle .rule{flex:1;height:1px;background:var(--slate-2)}

.big{font-family:'Archivo';font-weight:800;font-size:clamp(30px,9vw,46px);line-height:.95;letter-spacing:-.035em}
.big em{font-style:normal;color:var(--reef-dim)}

.pill{
  display:inline-block;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
  background:var(--slate-2);color:#41525B;
}
.pill.live{background:var(--reef-dim);color:#fff}
.pill.warn{background:var(--coral);color:#fff}
.pill.ok{background:#1E6B4F;color:#fff}
.pill.ochre{background:var(--ochre);color:#fff}

.btn{
  background:var(--abyss);color:var(--slate);border:none;border-radius:9px;
  padding:9px 14px;font-family:'Archivo';font-weight:700;font-size:12px;
  letter-spacing:.07em;text-transform:uppercase;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--slate-2)}
.btn:disabled{opacity:.45;cursor:wait}
.btn:focus-visible{outline:2px solid var(--reef-dim);outline-offset:2px}

/* ---------- day list ---------- */
.day{border-left:2px solid var(--slate-2);padding:0 0 2px 16px;margin-left:6px;position:relative}
.day::before{
  content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;
  background:var(--slate);border:2px solid var(--slate-2);
}
.day.today{border-left-color:var(--reef-dim)}
.day.today::before{background:var(--reef);border-color:var(--reef-dim)}
.day.past::before{background:var(--slate-2)}
.daybtn{
  width:100%;text-align:left;background:none;border:none;padding:12px 0;display:flex;gap:12px;align-items:baseline;
}
.dnum{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;min-width:52px}
.dttl{font-family:'Archivo';font-weight:700;font-size:15.5px;letter-spacing:-.015em;flex:1}
.dbase{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.daybody{padding:0 0 16px}
.sched{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;margin:4px 0 0}
.sched .t{font-family:'IBM Plex Mono';font-size:12px;color:var(--ochre);font-weight:600;padding-top:2px}
.sched .x{font-size:14px;padding-bottom:6px}
/* Diving / non-diving switch at the top of DAYS. Two equal halves,
   48px tall for wet hands, teal marks the active one. */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--slate-2);border-radius:12px;padding:4px;margin:14px 0 6px}
.seg button{
  min-height:48px;border:none;border-radius:9px;background:transparent;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 8px;text-align:center;line-height:1.15;-webkit-tap-highlight-color:transparent;
  font-family:'Archivo';font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  transition:background .18s ease-out,color .18s ease-out;
}
.seg button .c{font-family:'IBM Plex Mono';font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--muted);transition:color .18s ease-out}
.seg button[aria-selected="true"]{background:var(--reef-dim);color:#fff}
.seg button[aria-selected="true"] .c{color:#D4F1EE}
.seg button:focus-visible{outline:2px solid var(--reef-dim);outline-offset:2px}
.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--reef);margin-left:6px;vertical-align:middle}
.seglead{font-size:13.5px;color:var(--muted);margin:4px 0 10px}
@media (prefers-reduced-motion:reduce){.seg button,.seg button .c{transition:none}}
/* Ready for no signal — checklist on NOW */
.offlist{list-style:none;margin:14px 0 0;padding:0}
.offlist li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--slate-2)}
.offlist .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--slate-2);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-top:1px}
.offlist li.done .tick{background:var(--reef-dim);border-color:var(--reef-dim)}
.offlist .ob{flex:1;min-width:0}
.offlist .ot{font-family:'Archivo';font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.offlist .os{font-size:13.5px;color:var(--muted);margin-top:2px}
.offlist .row{margin-top:8px}
.offlist .btn{min-height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Pin names on the offline map */
.leaflet-tooltip.mklabel{background:rgba(7,26,36,.86);color:#F1EBDD;border:1px solid #1B5566;border-radius:6px;
  box-shadow:none;padding:2px 6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.04em}
.leaflet-tooltip.mklabel::before{display:none}
#map:not(.zoomed-in) .mklabel:not(.mklabel-hotel){display:none}
.dive{background:#EAF4F3;border:1px solid #CBE3E1;border-radius:10px;padding:10px 12px;margin-top:8px}
.dive .n{font-family:'Archivo';font-weight:700;font-size:14px}
.dive .m{font-family:'IBM Plex Mono';font-size:11px;color:var(--reef-dim);letter-spacing:.05em;text-transform:uppercase}

/* ---------- flights ---------- */
.leg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 4px}
.leg .iata{font-family:'Archivo';font-weight:800;font-size:26px;letter-spacing:-.03em}
.leg .city{font-size:12px;color:var(--muted)}
.leg .time{font-family:'IBM Plex Mono';font-size:14px;font-weight:600;margin-top:3px}
.leg .mid{text-align:center;color:var(--slate-2)}
.leg .r{text-align:right}
.dashed{border-top:1px dashed var(--slate-2);position:relative;width:100%;min-width:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin-top:10px}
.kv dt{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;font-weight:500}

/* ---------- weather ---------- */
.wxrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:10px}
.wx{background:var(--abyss);border-radius:10px;padding:10px 8px;text-align:center;color:var(--slate)}
.wx .d{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;color:#7F98A3;text-transform:uppercase}
.wx .i{font-size:20px;margin:5px 0 3px;line-height:1}
.wx .t{font-family:'IBM Plex Mono';font-size:13px;font-weight:600}
.wx .t small{color:#7F98A3;font-weight:400}
.sea{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.sea div{flex:1;min-width:110px}
.sea .v{font-family:'IBM Plex Mono';font-size:22px;font-weight:600;color:var(--reef-dim);line-height:1.1}

/* ---------- map ---------- */
#map{height:min(62vh,460px);border-radius:var(--r);border:1px solid var(--slate-2);margin-top:12px;background:#DCE8EA}
/* Tiles come from the CARTO CDN and are the one part of the map that needs
   a connection. When they fail, the container goes dark so the route and
   pins read as a deliberate schematic rather than a half-loaded page. */
#map.tiles-offline{background:var(--abyss);border-color:#0E3346}
#map.tiles-offline .leaflet-container{background:var(--abyss)}
#map.tiles-offline .leaflet-control-zoom a{background:#0E3346;color:#F1EBDD;border-color:#17B8AE}
#map.tiles-offline .leaflet-control-attribution{background:rgba(7,26,36,.75);color:#8FA3AB}
.map-offline-note{display:none;align-items:center;gap:8px;margin-top:10px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.45;
  color:var(--muted)}
.map-offline-note.on{display:flex}
.map-offline-note .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.mk{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk.dive{background:var(--reef-dim)}
.mk.hotel{background:var(--ochre)}
.mk.air{background:var(--abyss)}
.mk.town{background:var(--coral)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* ---------- misc ---------- */
.dvform{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.dvform label{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.dvform label.wide{grid-column:1/-1}
.dvform input,.dvform textarea{
  font-family:'Karla',sans-serif;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;
  border:1px solid var(--slate-2);border-radius:8px;padding:9px 10px;background:#fff;width:100%;
}
.dvform input:focus,.dvform textarea:focus{outline:2px solid var(--reef-dim);outline-offset:-1px}
.dvrow{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;font-size:inherit}
.dvnum{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;color:var(--reef-dim);text-align:right;line-height:1.15}
.dvnum small{font-size:11px;color:var(--muted);font-weight:400;margin-left:1px}
.dvnum span{display:block;font-size:14px}
.nextcard{background:var(--abyss);color:var(--slate);border-radius:var(--r);padding:16px;margin:12px 0}
.nextcard .eyebrow{color:var(--reef)}
.nexttrip{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #1B3A48;text-decoration:none;color:inherit}
.nexttrip .nm,.nexttrip .nn{display:block}
.nexttrip .arr{color:#5E7C89;margin-left:2px}
.nexttrip:last-child{border-bottom:none}
.nexttrip .nm{font-family:'Archivo';font-weight:700;font-size:14.5px}
.nexttrip .nn{font-size:12.5px;color:#9DB3BD;margin-top:2px}
.nexttrip .nw{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--reef);letter-spacing:.06em;white-space:nowrap;text-align:right}
.gear{
  width:100%;background:none;border:none;border-bottom:1px solid var(--slate-2);
  padding:11px 0;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;text-align:left;
}
.gear:last-child{border-bottom:none}
.gear .box{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--slate-2);background:var(--slate);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-top:1px;
}
.gear.on .box{background:var(--reef-dim);border-color:var(--reef-dim)}
.gear .gl{display:block;font-size:14.5px;font-weight:500;line-height:1.35}
.gear.on .gl{color:var(--muted);text-decoration:line-through}
.gear .gn{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.gear:focus-visible{outline:2px solid var(--reef-dim);outline-offset:2px;border-radius:6px}
.factgrp{
  width:100%;background:none;border:none;padding:2px 0;display:flex;justify-content:space-between;align-items:center;
  font-family:'Archivo';font-weight:700;font-size:15.5px;letter-spacing:-.015em;color:var(--ink);text-align:left;
}
.factgrp .cnt{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.fact{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--slate-2)}
.fact:last-child{border-bottom:none}
.fact .n{font-family:'IBM Plex Mono';font-size:11px;color:var(--reef-dim);font-weight:600;padding-top:3px}
.note{font-size:12.5px;color:var(--muted);font-style:italic}
.banner{
  background:var(--ochre);color:#fff;border-radius:var(--r);padding:13px 15px;margin:12px 0;
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
}
.banner p{margin:0;font-size:13.5px}
.banner b{font-family:'Archivo'}
.banner button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-family:'Archivo';font-weight:700;letter-spacing:.06em;text-transform:uppercase}
textarea{
  width:100%;min-height:340px;font-family:'IBM Plex Mono';font-size:11.5px;line-height:1.55;
  border:1px solid var(--slate-2);border-radius:10px;padding:12px;background:#fff;color:var(--ink);resize:vertical;
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.err{color:var(--coral);font-size:13px;font-weight:700;margin-top:8px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--slate-2);border-top-color:var(--reef-dim);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- documents ---------- */
.privacy{
  background:var(--abyss);color:var(--slate);border-radius:var(--r);padding:14px 16px;margin:12px 0;
}
.privacy .eyebrow{color:var(--reef)}
.privacy p{margin:6px 0 0;font-size:13.5px;color:#C6D3D8}
.prog{height:5px;background:var(--slate-2);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--reef-dim);border-radius:99px;transition:width .4s ease}
.doc{display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--slate-2)}
.doc:last-of-type{border-bottom:none}
.thumb{
  width:52px;height:52px;border-radius:9px;background:var(--slate);border:1px solid var(--slate-2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:19px;color:var(--muted);
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.done{border-color:var(--reef-dim);border-width:2px}
.doc .l{font-family:'Archivo';font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.doc .s{font-size:12px;color:var(--muted);margin-top:2px}
.doc .s b{color:var(--reef-dim)}
.iconbtn{
  background:none;border:1px solid var(--slate-2);border-radius:8px;width:32px;height:32px;
  font-size:13px;color:var(--muted);line-height:1;
}
.iconbtn:focus-visible{outline:2px solid var(--reef-dim);outline-offset:2px}
.docacts{display:flex;gap:6px}
.modal{
  position:fixed;inset:0;background:rgba(7,26,36,.94);z-index:900;
  display:flex;flex-direction:column;padding:14px;
}
.modal .bar{display:flex;justify-content:space-between;align-items:center;color:var(--slate);margin-bottom:12px}
.modal .bar h3{font-size:15px}
.modal .body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}
.modal img{max-width:100%;max-height:100%;border-radius:10px}
.modal iframe{width:100%;height:100%;border:none;border-radius:10px;background:#fff}
.offbar{
  background:var(--coral);color:#fff;text-align:center;padding:6px 12px;
  font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;text-transform:uppercase;
}
.installbar{
  background:var(--reef-dim);color:#fff;border-radius:var(--r);padding:12px 15px;margin:12px 0;
  display:flex;gap:12px;align-items:center;justify-content:space-between;
}
.installbar p{margin:0;font-size:13.5px}
.installbar button{background:rgba(255,255,255,.22);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-family:'Archivo';font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- photo hero (Now) ---------- */

<script>
/* ============================================================
   MALAKAY TRAVELS — CLIENT TRIP COMPANION
   Single-file app. Replace SEED via the Setup tab, or load
   a different trip JSON per departure.
   ============================================================ */


/* Every visible string is {pl, en}. tr() picks by the chosen language. */
/* ============================================================
   TRIP LOADER  —  v35 consolidated shell
   ------------------------------------------------------------
   Trip content no longer lives in this file. Each departure is a
   separate JSON file in trips/, and this shell fetches the one the
   link asks for:

       app.malakaytravels.com/#trip=japan-dec26
       app.malakaytravels.com/#trip=cebu-nov26&t=04042026

   The part after # is a URL fragment. Browsers never send it to the
   server, so neither the trip name nor the contract number appears in
   any hosting access log. That is the whole reason it is a # and not
   a ? — it removes a pseudonymous identifier from a US server log at
   no cost.

   ?trip= and ?t= still work, so any link already sent keeps working.
   ============================================================ */

const DEFAULT_TRIP = "cebu-nov26";
const KNOWN_TRIPS  = ["cebu-nov26", "palawan-nov26", "japan-dec26", "palawan-nye"];

/* Reads a parameter from either the fragment or the query string.
   The fragment wins; the query string is the fallback for old links. */
function urlParams(){
  const out = new URLSearchParams();
  try{
    const h = (location.hash || "").replace(/^#/, "");
    if(h) new URLSearchParams(h).forEach((v, k) => out.set(k, v));
  }catch(e){}
  try{
    new URLSearchParams(location.search).forEach((v, k) => { if(!out.has(k)) out.set(k, v); });
  }catch(e){}
  return out;
}

/* Which trip is this?
   The link a client is sent carries #trip=<id>. But a home-screen icon on
   Android launches start_url from the manifest, which cannot carry a
   fragment — so by the time it matters most, on the boat, the fragment is
   gone. We therefore remember the last valid trip this device opened and
   fall back to that before falling back to the default. The URL always
   wins when it is present, so re-sending a corrected link still works.
   Unprefixed on purpose: which trip this phone belongs to is a fact about
   the device, not about any one departure. */
const TRIP_ID = (function(){
  let fromUrl = "";
  try{
    fromUrl = (urlParams().get("trip") || "").trim().toLowerCase();
  }catch(e){}
  if(KNOWN_TRIPS.includes(fromUrl)){
    try{ localStorage.setItem("malakay:lastTrip", fromUrl); }catch(e){}
    return fromUrl;
  }
  try{
    const remembered = (localStorage.getItem("malakay:lastTrip") || "").trim().toLowerCase();
    if(KNOWN_TRIPS.includes(remembered)) return remembered;
  }catch(e){}
  return DEFAULT_TRIP;
})();

/* Per-trip storage namespace.
   Four trips now share one web address, which means they share one
   storage area. Without this prefix, the Palawan group's dive log and
   the Cebu group's dive log would be the same log. Language, first
   name and the document wallet stay unprefixed: those belong to the
   person, not to the departure. */
const K = s => "malakay:" + TRIP_ID + ":" + s;

let SEED = null;

const APP_VERSION = "v57 · PL/EN · " + TRIP_ID;

async function fetchTrip(){
  const res = await fetch("trips/" + TRIP_ID + ".json", { cache: "no-cache" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  /* The service worker marks a copy served from the phone. Anything else
     came from the server just now — remember when, for the NOW screen. */
  if(!res.headers.get("x-malakay-offline")){
    try{ await window.storage.set(K("tripFetchedAt"), String(Date.now())); }catch(e){}
  }
  return await res.json();
}

function loadFailed(err){
  const pl = (navigator.language || "").slice(0,2) === "pl";
  document.body.innerHTML =
    '<div style="max-width:420px;margin:0 auto;padding:64px 22px;font-family:Karla,system-ui,sans-serif;color:#12212A">'
    + '<div style="font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em;margin-bottom:12px">'
    + (pl ? "Nie udało się wczytać wyprawy" : "Could not load the trip")
    + '</div><p style="line-height:1.55;color:#5F6E76;margin:0 0 18px">'
    + (pl
        ? "Sprawdź połączenie i odśwież stronę. Jeśli aplikacja była już wcześniej otwarta na tym telefonie, powinna działać także bez internetu — spróbuj zamknąć ją całkowicie i otworzyć ponownie."
        : "Check your connection and reload. If the app has been opened on this phone before it should also work offline — try closing it fully and opening it again.")
    + '</p><p style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#5F6E76">trips/' + TRIP_ID + '.json — ' + String(err && err.message || err) + '</p>'
    + '<p style="font-size:13px;color:#5F6E76">Michał Sieczkowski · +48 509 905 507</p></div>';
}


/* ---------------- language ---------------- */
const LANGS = ["pl","en"];
let lang = "pl";

/* Trip content is stored as {pl, en}; plain strings are used as-is. */
function tr(v){
  if(v == null) return "";
  if(typeof v === "object" && !Array.isArray(v) && (v.pl || v.en)) return v[lang] ?? v.pl ?? v.en;
  return v;
}

const UI = {
  pl:{
    tabs:{now:"Teraz",days:"Dni",flights:"Loty",stay:"Noclegi",docs:"Dokumenty",gear:"Pakowanie",log:"Dziennik",passport:"Paszport",map:"Mapa",guide:"Info",setup:"Ustawienia"},
    passport:{
      title:"Paszport", sub:"Twoje wyprawy z Malakay",
      hero:"Paszport wypraw", since:"od",
      trips:"Wyprawy", countries:"Kraje", dives:"Nurkowania", hours:"Pod wodą",
      search:"Szukaj kraju, miejscówki, restauracji…",
      results:"wyników", nothing:"Nic takiego w paszporcie.",
      nothingNote:"Spróbuj nazwy kraju, miejscówki albo osoby. Szukanie działa też bez internetu.",
      tagCountry:"Kraj", tagTrip:"Wyprawa", tagDive:"Miejscówka", tagPlace:"Miejsce", tagPerson:"Osoba",
      empty:"Paszport jest jeszcze pusty.",
      emptyNote:"Otwórz swoją wyprawę, a zapisze się tutaj sama. Każda kolejna dołączy do archiwum.",
      thisTrip:"Ta wyprawa", upcoming:"Nadchodzi", past:"Za nami", current:"Trwa",
      nights:"nocy", bases:"Bazy", deepest:"Najgłębiej", longest:"Najdłużej",
      back:"Paszport", noDives:"Wyprawa bez nurkowania — paszport zapisuje ją tak samo.",
      export:"Zapisz kopię zapasową", import:"Przywróć z kopii",
      exported:"Kopia zapisana w plikach telefonu",
      importOk:"Wczytano wypraw: ", importBad:"Nie udało się odczytać pliku.",

async function setLang(l){
  lang = l;
  try{ await window.storage.set("malakay:lang", l); }catch(e){}
  document.documentElement.lang = l;
  if(!$("#namegate").classList.contains("hidden")) paintGate();
  render();
}
async function loadLang(){
  try{
    const r = await window.storage.get("malakay:lang");
    if(r?.value && LANGS.includes(r.value)) lang = r.value;
    else if((navigator.language||"").slice(0,2) !== "pl") lang = "en";
  }catch(e){
    if((navigator.language||"").slice(0,2) !== "pl") lang = "en";
  }
  document.documentElement.lang = lang;
}

/* Build a Google Maps link that shows a readable place name rather than
   raw coordinates. placeId, when present, guarantees the exact venue. */
function mapsUrl(name, address, coords, placeId){
  const q = [name, address].filter(Boolean).join(", ");
  if(!q) return `https://www.google.com/maps/search/?api=1&query=${coords[0]},${coords[1]}`;
  let u = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  if(placeId) u += `&query_place_id=${encodeURIComponent(placeId)}`;
  return u;
}

   The Claude preview injects a window.storage; a plain web host does not.
   When it is missing we back the same four methods with IndexedDB, so
   passport scans and the dive log survive a reload. localStorage is the
   last resort — it is capped around 5 MB and cannot hold scans, but it
   keeps language, gear ticks and the trip itself working. */
if(!window.storage){
  window.storage = (function(){
    const DB = "malakay", STORE = "kv";
    const hasIDB = (() => { try { return !!window.indexedDB; } catch(e){ return false; } })();

    if(hasIDB){
      let dbp = null;
      const open = () => dbp || (dbp = new Promise((res, rej) => {
        const q = indexedDB.open(DB, 1);
        q.onupgradeneeded = () => q.result.createObjectStore(STORE);
        q.onsuccess = () => res(q.result);
        q.onerror   = () => rej(q.error || new Error("indexeddb"));
      }));
      const run = async (mode, fn) => {
        const db = await open();
        return new Promise((res, rej) => {
          const t = db.transaction(STORE, mode);
          const r = fn(t.objectStore(STORE));
          t.oncomplete = () => res(r ? r.result : undefined);
          t.onerror    = () => rej(t.error || new Error("tx"));
          t.onabort    = () => rej(t.error || new Error("abort"));
        });
      };
      return {
        async get(key){
          const v = await run("readonly", s => s.get(key));
          if(v === undefined) throw new Error("not found: " + key);
          return { key, value: v };
        },
        async set(key, value){ await run("readwrite", s => s.put(String(value), key)); return { key, value }; },
        async delete(key){ await run("readwrite", s => s.delete(key)); return { key, deleted: true }; },
        async list(prefix){
          const keys = await run("readonly", s => s.getAllKeys());
          const p = prefix || "";
          return { keys: (keys || []).map(String).filter(k => k.indexOf(p) === 0) };
        }
      };
    }

    const LS = window.localStorage;
    return {
      async get(key){
        const v = LS ? LS.getItem(key) : null;
        if(v === null) throw new Error("not found: " + key);
        return { key, value: v };
      },
      async set(key, value){
        if(!LS) throw new Error("no storage");
        LS.setItem(key, String(value));      // throws QuotaExceeded on big scans
        return { key, value };
      },
      async delete(key){ if(LS) LS.removeItem(key); return { key, deleted: true }; },
      async list(prefix){
        const p = prefix || "", keys = [];
        for(let i = 0; LS && i < LS.length; i++){
          const k = LS.key(i);
          if(k && k.indexOf(p) === 0) keys.push(k);
        }
        return { keys };
      }
    };
  })();
}

/* ---------------- document wallet ----------------
   Files never leave the traveller's own device. They are compressed
   in the browser and written to local storage, one key per slot.
   Malakay Travels never receives them.
--------------------------------------------------- */
let wallet = {};          // slotId -> {name, mime, data, added, bytes}
let walletLoaded = false;

async function loadWallet(){
  wallet = {};
  try{
    const list = await window.storage.list("malakay:doc:");
    for(const k of (list?.keys || [])){
      try{
        const r = await window.storage.get(k);
        if(r?.value) wallet[k.replace("malakay:doc:","")] = JSON.parse(r.value);
      }catch(e){}
    }
  }catch(e){}
  walletLoaded = true;
}

function readFile(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Could not read that file"));
    r.readAsDataURL(file);
  });
}

async function shrinkImage(dataUrl){
  const img = await new Promise((res,rej)=>{
    const i = new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("bad image")); i.src = dataUrl;
  });
  const MAX = 1500;
  const scale = Math.min(1, MAX / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", 0.72);
}

async function storeDoc(slotId, file){
  docMsg(slotId, U().saving);
  try{
    let data = await readFile(file);
    let mime = file.type || "application/octet-stream";
    if(mime.startsWith("image/")){ data = await shrinkImage(data); mime = "image/jpeg"; }
    if(data.length > 4.4e6) throw new Error(U().tooLarge);
    const rec = { name:file.name, mime, data, added:new Date().toISOString(), bytes:data.length };
    await window.storage.set("malakay:doc:"+slotId, JSON.stringify(rec));
    wallet[slotId] = rec;
    render();
  }catch(e){
    docMsg(slotId, e.message || U().cannotSave);
  }
}

async function removeDoc(slotId){
  try{ await window.storage.delete("malakay:doc:"+slotId); }catch(e){}
  delete wallet[slotId];
  render();
}

function docMsg(slotId, text){
  const n = document.getElementById("msg-"+slotId);
  if(n) n.innerHTML = `<span class="err" style="font-size:12px">${esc(text)}</span>`;
}

function openDoc(slotId){
  const rec = wallet[slotId]; if(!rec) return;
  const slot = trip.documents.wallet.find(s=>s.id===slotId);
  const m = el(`<div class="modal">
    <div class="bar"><h3>${esc(slot?tr(slot.label):rec.name)}</h3>
      <button class="btn ghost" id="closedoc" style="color:var(--slate);border-color:#2A4C5C">${U().close}</button></div>
    <div class="body"></div></div>`);
  const body = m.querySelector(".body");
  body.appendChild(rec.mime === "application/pdf"
    ? el(`<iframe src="${rec.data}" title="${esc(rec.name)}"></iframe>`)
    : el(`<img src="${rec.data}" alt="${esc(rec.name)}">`));
  m.addEventListener("click", ev => { if(ev.target === m || ev.target.id === "closedoc") m.remove(); });
  document.body.appendChild(m);
}

/* ---------------- time helpers ---------------- */
const parseLocal = s => { const [d,t] = s.split(" "); const [Y,M,D]=d.split("-").map(Number); const [h,m]=(t||"00:00").split(":").map(Number); return new Date(Y,M-1,D,h,m); };
const dateOnly = s => parseLocal(s + " 00:00");
const todayISO = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const fmtDate = s => dateOnly(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const fmtTime = s => s.split(" ")[1] || "";
function daysBetween(a,b){ return Math.round((dateOnly(b)-dateOnly(a))/86400000); }
function tzNow(tz){
  try{ return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); }
  catch(e){ return "--:--"; }
}

function tripPhase(){
  const t = todayISO(), m = trip.meta;
  if(daysBetween(t, m.start) > 0) return {phase:"before", days:daysBetween(t,m.start)};
  if(daysBetween(t, m.end) < 0) return {phase:"after"};
  return {phase:"during", dayIndex: trip.days.findIndex(d => d.date === t)};
}
/* Before departure, show the destination — nobody counting down 103 days
   wants the Warsaw forecast. During the trip, show where you actually are. */
function weatherPlace(){
  const p = tripPhase();
  if(p.phase === "during"){
    const d = currentDay();
    if(d?.coords) return { coords:d.coords, base:d.base, preview:false };
  }
  /* Pick the first day that is actually at the destination rather than
     in transit. This used to test "latitude below 30", which quietly
     meant "the Philippines" and matched nothing in Japan. Comparing
     against the trip's own first base works anywhere. */
  const home = (trip.flights && trip.flights[0] && trip.flights[0].dep.tz) || "Europe/Warsaw";
  const first = (trip.days || []).find(d => d.coords && d.base && tr(d.base) && d.n > 1
                  && !/w drodze|in transit/i.test(tr(d.base)))
             || (trip.days || []).find(d => d.coords && d.n > 1)
             || trip.days?.[1];
  return { coords: first?.coords, base: first?.base, preview: p.phase !== "during" };
}

function currentDay(){
  const p = tripPhase();
  if(p.phase === "during" && p.dayIndex >= 0) return trip.days[p.dayIndex];
  if(p.phase === "before") return trip.days[0];
  return trip.days[trip.days.length-1];
}
function currentHotel(){
  const t = todayISO();
  return trip.hotels.find(h => !h.optional && daysBetween(h.checkIn,t) >= 0 && daysBetween(t,h.checkOut) > 0) || trip.hotels[0];
}
function nextFlight(){
  const now = new Date();
  return trip.flights.find(f => parseLocal(f.dep.time) > now) || null;
}

/* ---------------- weather ---------------- */
let wxAt = null;          // when the current reading was taken
let wxStale = false;      // true when we are showing a saved reading
let wxFailAt = 0;         // last failed fetch — no retry for a minute

/* Last good reading is kept on the device so the app still has
   something to show on a boat with no signal. */
async function cacheWx(key){
  try{ await window.storage.set(K("wx:")+key,
    JSON.stringify({wx, marine, at:new Date().toISOString()})); }catch(e){}
}
async function restoreWx(key){
  try{
    const r = await window.storage.get(K("wx:")+key);
    if(!r?.value) return false;
    const s = JSON.parse(r.value);
    wx = s.wx; marine = s.marine; wxAt = new Date(s.at); wxStale = true;
    return true;
  }catch(e){ return false; }
}

async function getWeather(lat,lng){
  const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
  /* render() calls this, and this calls render(). With no signal the fetch
     fails at once, so without a pause the two chased each other hundreds
     of times a second — flat battery, and buttons replaced mid-tap. */
  if(Date.now() - wxFailAt < 60000 && wxKey === key) return;
  if(wxKey === key && wx && !wxStale) return;   // fresh already, nothing to do
  if(wxKey !== key){ wx = null; marine = null; wxAt = null; wxStale = false; }
  wxKey = key;

  // Show the saved reading immediately, then try to better it.
  if(!wx){ if(await restoreWx(key) && (tab === "now" || tab === "days")) render(); }

  let got = false;
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}`
      + `&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      + `&timezone=auto&forecast_days=5`;
    const r = await fetch(u);
    if(r.ok){ wx = await r.json(); got = true; }
  }catch(e){}

  if(got){
    try{
      const u2 = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}`
        + `&current=sea_surface_temperature,wave_height&timezone=auto`;
      const r2 = await fetch(u2); if(r2.ok) marine = await r2.json();
    }catch(e){}
    wxAt = new Date(); wxStale = false;
    cacheWx(key);
  }else{
    // Failed. Try again after a pause (or when signal returns), not at once.
    wxFailAt = Date.now();
  }
  /* Weather shows on NOW and DAYS only. Re-rendering MAP for it rebuilt the
     map mid fly-in and left the old intro's handlers pointing at a dead map. */
  if(tab === "now" || tab === "days") render();
  band();
}

/* ---------------- instrument band ---------------- */
/* Where this trip actually goes. The first flight tells us the city we
   leave from; the first flight that lands in the trip's own timezone
   tells us where we are heading. Falls back to the country, which is
   never wrong even if the flight data is thin. */
/* A trip dives if it says how many dives it has, or if any day lists
   dive sites. Japan has neither, so the dive furniture stays hidden. */
function isDiveTrip(){
  if(trip.meta && trip.meta.dives != null) return true;
  return (trip.days || []).some(d => (d.dives || []).length);
}

/* "Asia/Tokyo" -> "JP". Short label for the status band. */
const TZ_LABEL = {
  "Asia/Manila":"PH", "Asia/Tokyo":"JP", "Asia/Jakarta":"ID", "Asia/Makassar":"ID",
  "Africa/Cairo":"EG", "Europe/Warsaw":"PL", "Pacific/Guadalcanal":"SB",
  "Pacific/Chuuk":"FM", "Africa/Sao_Tome":"ST"
};
function tzLabel(tz){
  return TZ_LABEL[tz] || String(tz || "").split("/").pop().replace(/_/g," ").slice(0,3).toUpperCase();
}

function introRoute(){
  /* An explicit meta.route in the trip file always wins. Everything
     below is only a sensible default. */
  if(trip.meta.route) return tr(trip.meta.route);
  const legs = (trip.flights && trip.flights.length) ? trip.flights : [];
  const from = cityOnly(legs[0] && tr(legs[0].dep.city));
  const into = (legs.find(f => f.arr && f.arr.tz === trip.meta.tz) || {}).arr;
  const to   = into ? cityOnly(tr(into.city)) : tr(trip.meta.country);
  return (from && to) ? `${from} \u2192 ${to}` : tr(trip.meta.country);
}

/* Airport fields are written "City AirportName" — "Warszawa Chopina",
   "Cebu Mactan (T2)", "Tokio Haneda". For a route caption we want the
   city. Drop anything bracketed, then drop a trailing airport name. */
function cityOnly(s){
  s = String(s || "").replace(/\s*\(.*?\)\s*/g, " ").trim();
  const w = s.split(/\s+/);
  return w.length === 2 ? w[0] : s;
}

function band(){
  const m = trip.meta, p = tripPhase();
  $("#tripcode").textContent = m.code;

  $("#langsw").innerHTML = LANGS.map(l =>
    `<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");

  if(p.phase === "before"){
    $("#k1").textContent = U().departsIn;
    $("#v1").innerHTML = `<span class="live"></span>${p.days} <small>${U().days_} · ${fmtDate(m.start)}</small>`;
  } else if(p.phase === "after"){
    $("#k1").textContent = U().trip; $("#v1").innerHTML = `${U().complete} <small>· ${trip.days.length} ${U().days_}</small>`;
  } else {
    const d = currentDay();
    $("#k1").textContent = U().today;
    $("#v1").innerHTML = `<span class="live"></span>${U().day} ${d ? d.n : "—"} <small>· ${d ? esc(tr(d.base)) : ""}</small>`;
  }
  $("#k2") && ($("#k2").textContent = U().localTime);
  $("#k3") && ($("#k3").textContent = U().water);
  $("#k3") && ($("#k3").textContent = U().water);
  $("#v2").innerHTML = `${tzNow(m.tz)}<small> ${esc(tzLabel(m.tz))}</small>`;
  /* Sea temperature belongs to a diving trip. On a land trip show how
     far in we are instead — the slot is too prominent to leave blank. */
  if(isDiveTrip()){
    $("#k3") && ($("#k3").textContent = U().water);
    const sst = marine?.current?.sea_surface_temperature;
    $("#v3").innerHTML = sst != null ? `${Math.round(sst)}<small>°C</small>` : `<small>—</small>`;
  } else {
    $("#k3") && ($("#k3").textContent = U().tripLength);
    $("#v3").innerHTML = `${trip.days.length}<small> ${U().days_}</small>`;
  }
}

/* ---------------- views ---------------- */
const CLIENT_TABS = ["now","days","flights","stay","docs","gear","log","passport","map","guide"];
let setupUnlocked = false;   // Setup tab is hidden from clients

/* Unlock with ?setup at the end of the address; ?setup=0 hides it again.
   The choice is remembered on that device only. */
async function loadSetupFlag(){
  const q = urlParams();
  if(q.has("setup")){
    setupUnlocked = q.get("setup") !== "0";
    try{ await window.storage.set("malakay:setup", setupUnlocked ? "1" : "0"); }catch(e){}
    // Leaving ?setup in the address bar means one forwarded link unlocks the
    // tab for everyone it reaches. Take it back out.
    try{
      const u = new URL(location.href);
      u.searchParams.delete("setup");
      if(u.hash){
        const hp = new URLSearchParams(u.hash.replace(/^#/, ""));
        hp.delete("setup");
        const rest = hp.toString();
        u.hash = rest ? "#" + rest : "";
      }
      history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
    }catch(e){}
    return;
  }
  try{
    const r = await window.storage.get("malakay:setup");
    setupUnlocked = r?.value === "1";
  }catch(e){ setupUnlocked = false; }
}
const TABS = () => setupUnlocked ? [...CLIENT_TABS, "setup"] : CLIENT_TABS;

  const head = greet + `<div class="hero">

      <div class="hfact"><span class="fk">${U().tripLength}</span><span class="fv">${trip.days.length}<small>${U().days_}</small></span></div>
      <div class="hfact"><span class="fk">${U().bases}</span><span class="fv">${bases}</span></div>
      <div class="hfact"><span class="fk">${U().dives}</span><span class="fv">${trip.meta.dives ?? "\u2014"}</span></div>
    </div>
  </div>` + noFlyCard() + dayCard;

  const wp = weatherPlace();
  const wxBlock = wx ? (() => {
    const c = wx.current, code = WMO[c.weather_code] || ["·","—"];
    const days = wx.daily.time.map((t,i)=>{
      const w = WMO[wx.daily.weather_code[i]] || ["·",""];
      const lbl = i===0 ? "Today" : dateOnly(t).toLocaleDateString(undefined,{weekday:"short"});
      return `<div class="wx"><div class="d">${lbl}</div><div class="i">${w[0]}</div>
        <div class="t">${Math.round(wx.daily.temperature_2m_max[i])}°<small>/${Math.round(wx.daily.temperature_2m_min[i])}°</small></div></div>`;
    }).join("");
    const sst = marine?.current?.sea_surface_temperature, wave = marine?.current?.wave_height;
    return `<div class="card">
      <div class="hd"><div><div class="eyebrow">${U().liveConditions}</div>
        <h3 style="margin-top:4px">${esc(tr(wp.base) || tr(trip.meta.country))}</h3></div>
        <span class="pill ${wxStale?"warn":"live"}">${wxStale?U().saved:(wp.preview?U().atDestination:U().live)}</span></div>
      <div class="sea">
        <div><div class="eyebrow">${U().air}</div><div class="v">${Math.round(c.temperature_2m)}°C</div><div class="note">${code[1]}</div></div>
        <div><div class="eyebrow">${U().seaTemp}</div><div class="v">${sst!=null?Math.round(sst)+"°C":"—"}</div><div class="note">${sst!=null?U().shorty:U().noMarine}</div></div>
        <div><div class="eyebrow">${U().swell}</div><div class="v">${wave!=null?wave.toFixed(1)+" m":"—"}</div><div class="note">${wave!=null?(wave<0.7?U().comfortable:U().expectMovement):"—"}</div></div>
      </div>
      <div class="wxrow">${days}</div>
      <p class="note" style="margin:10px 0 0">${wxStale
        ? `${U().lastReading}: ${wxAt ? wxAt.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "—"}. ${U().willRefresh}`
        : wp.preview
          ? `${U().wxPreview} ${esc(tr(wp.base)||"")}. ${U().seaNote}`
          : `${U().forecastFrom} ${esc(tr(wp.base)||"")}. ${U().seaNote}`}</p>
    </div>`;
  })() : (navigator.onLine && !wxFailAt
    ? `<div class="card"><span class="spin"></span>${U().loadingCond}</div>`
    : `<div class="card">
        <div class="hd"><div><div class="eyebrow">${U().liveConditions}</div>
          <h3 style="margin-top:4px">${U().condNotSaved}</h3>
          <p class="sub">${U().condHint}</p></div>
          <span class="pill warn">Offline</span></div>
      </div>`);

  const flightBlock = f ? `<div class="card">
    <div class="hd"><div><div class="eyebrow">${U().nextFlight}</div>
      <h3 style="margin-top:4px">${esc(tr(f.label))}</h3>
      <p class="sub">${esc(f.dep.iata)} → ${esc(f.arr.iata)} · ${fmtDate(f.dep.time.split(" ")[0])}</p></div>
      <button class="btn ghost" data-goto="flights">${U().open}</button></div></div>` : "";

  const hotelBlock = h ? `<div class="card">
    <div class="hd"><div><div class="eyebrow">${p.phase==="during"?U().tonight:U().firstBase}</div>
      <h3 style="margin-top:4px">${esc(h.name)}</h3>
      <p class="sub">${esc(tr(h.place))}</p></div>
      <button class="btn ghost" data-goto="stay">${U().open}</button></div></div>` : "";

  const req = (trip.documents?.wallet || []).filter(s=>s.required);
  const ready = req.filter(s=>wallet[s.id]).length;
  const docsBlock = req.length ? `<div class="card">
    <div class="hd"><div><div class="eyebrow">${U().yourDocs}</div>
      <h3 style="margin-top:4px">${ready} / ${req.length} ${U().ready}</h3>
      <p class="sub">${ready===req.length ? U().docsAllSaved : U().docsAdd}</p></div>
      <button class="btn ${ready===req.length?"ghost":""}" data-goto="docs">${ready===req.length?U().open:U().add}</button></div>
    <div class="prog" style="margin-top:12px"><i style="width:${Math.round(ready/req.length*100)}%"></i></div>
  </div>` : "";

  const iosLike = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let installBlock = "";
  if(!standalone && installEvent){
    installBlock = `<div class="installbar">
      <p><b>${U().installTitle}</b> — ${U().installBody}</p>
      <button id="installbtn">${U().add}</button></div>`;
  } else if(!standalone && iosLike){
    installBlock = `<div class="installbar">
      <p><b>${U().installTitle}.</b> ${U().installIos}</p></div>`;
  }

  const gc = gearCount();
  const gearBlock = (p.phase === "before" && gc.total) ? `<div class="card">
    <div class="hd"><div><div class="eyebrow">${U().packList}</div>
      <h3 style="margin-top:4px">${gc.done} / ${gc.total} ${U().packReady}</h3></div>
      <button class="btn ${gc.done===gc.total?"ghost":""}" data-goto="gear">${U().open}</button></div>
    <div class="prog" style="margin-top:12px"><i style="width:${gc.total?Math.round(gc.done/gc.total*100):0}%"></i></div>
  </div>` : "";

  // Near the end of the trip and afterwards, show what is coming next.
  const nearEnd = p.phase === "after" ||
    (p.phase === "during" && daysBetween(todayISO(), trip.meta.end) <= 2) ||
    setupUnlocked;   // staff preview — clients only see it at the end of the trip
  const site = trip.meta.website || "";
  const mail = trip.meta.email || "";
  const nextBlock = (nearEnd && (trip.nextTrips||[]).length && site) ? `<div class="nextcard">
    <div class="eyebrow">${U().whatsNext}${(setupUnlocked && !(p.phase==="after" || (p.phase==="during" && daysBetween(todayISO(), trip.meta.end) <= 2))) ? ` · ${U().staffPreview}` : ""}</div>
    <p style="margin:6px 0 10px;font-size:13.5px;color:#C6D3D8">${U().whatsNextNote}</p>
    ${trip.nextTrips.map(t=>`<a class="nexttrip" href="${esc(t.url || site)}" target="_blank" rel="noopener">
      <span><span class="nm">${esc(tr(t.name))}</span><span class="nn">${esc(tr(t.note))}</span></span>
      <span class="nw">${esc(tr(t.when))} <span class="arr">→</span></span></a>`).join("")}
    <div class="row">
      <a class="btn" style="background:var(--reef-dim);text-decoration:none"
         href="${esc(site)}" target="_blank" rel="noopener">${U().nextCta}</a>
      <a class="btn ghost" style="color:var(--slate);border-color:#2A4C5C;text-decoration:none"
         href="mailto:${esc(mail)}?subject=${encodeURIComponent(U().nextSubject)}">${U().nextEmail}</a>
    </div>
  </div>` : "";

  return head + nextBlock + installBlock + offlineBlock() + docsBlock + gearBlock + wxBlock + flightBlock + hotelBlock;
}

/* A dive day either lists its dives, or is flagged diveDay in the trip
   file when the sites are written into the schedule instead. */
const isDiveDay = d => (d.dives || []).length > 0 || d.diveDay === true;

function dayCount(n){
  if(n === 1) return lang === "pl" ? "1 dzień" : "1 day";
  return `${n} ${U().days_}`;
}

function viewDays(){
  const t = todayISO();
  const diveDays = trip.days.filter(isDiveDay);
  const landDays = trip.days.filter(d => !isDiveDay(d));
  /* A trip with no diving has nothing to switch between — show every day. */
  const split = diveDays.length > 0 && landDays.length > 0;
  if(split && !daysMode){
    const today = trip.days.find(d => d.date === t);
    daysMode = today && !isDiveDay(today) ? "land" : "dive";
  }
  const list = !split ? trip.days : daysMode === "land" ? landDays : diveDays;
  const hasToday = ds => ds.some(d => d.date === t);
  const segBtn = (mode, label, ds) =>
    `<button role="tab" id="seg-${mode}" aria-controls="daylist" aria-selected="${daysMode===mode}" data-dmode="${mode}">
      <span>${label}${hasToday(ds) && daysMode!==mode ? `<span class="dot" aria-label="${U().today}"></span>` : ""}</span>
      <span class="c">${dayCount(ds.length)}</span></button>`;

  return `<div class="sectitle"><h2>${U().dayByDay}</h2><div class="rule"></div>
    <span class="pill">${dayCount(trip.days.length)}</span></div>` +
  (split ? `<div class="seg" role="tablist" aria-label="${U().dayByDay}">
      ${segBtn("dive", U().divingItinerary, diveDays)}
      ${segBtn("land", U().nonDiving, landDays)}</div>
    <p class="seglead">${daysMode==="land" ? U().nonDivingLead : U().divingLead}</p>` : "") +
  `<div id="daylist" ${split ? `role="tabpanel" aria-labelledby="seg-${daysMode}"` : ""}>` +
  list.map((d, i)=>{
    const isToday = d.date === t, past = daysBetween(d.date,t) > 0;
    const open = isToday || (tripPhase().phase==="before" && i===0);
    return `<div class="day ${isToday?"today":""} ${past?"past":""}">
      <button class="daybtn" data-day="${d.n}" aria-expanded="${open}">
        <span class="dnum">D${String(d.n).padStart(2,"0")}<br>${fmtDate(d.date).split(",")[0]}</span>
        <span class="dttl">${esc(tr(d.title))}${isToday?` <span class="pill live">${U().today}</span>`:""}</span>
        <span class="dbase">${esc(tr(d.base))}</span>
      </button>
      <div class="daybody ${open?"":"hidden"}" id="dbody-${d.n}">
        <div class="sched">${(d.items||[]).map(([tm,x])=>`<div class="t">${esc(tm)}</div><div class="x">${esc(tr(x))}</div>`).join("")}</div>
        ${(d.dives||[]).map(dv=>`<div class="dive"><div class="n">${esc(tr(dv.site))}</div>
          <div class="m">${U().maxDepth} ${esc(tr(dv.depth))}</div>
          <div style="font-size:13.5px;margin-top:4px">${esc(tr(dv.note))}</div></div>`).join("")}
        ${d.note?`<p class="note" style="margin-top:10px">${esc(tr(d.note))}</p>`:""}
        ${d.coords?`<div class="row"><button class="btn ghost" data-goto="map" data-focus="${d.coords[0]},${d.coords[1]}">${U().showOnMap} · ${esc(tr(d.base))}</button></div>`:""}
      </div></div>`;
  }).join("") + `</div>`;
}

         <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener"

function viewStay(){
  const t = todayISO();
  const core = trip.hotels.filter(h=>!h.optional);
  const nightsTotal = core.reduce((n,h)=>n+daysBetween(h.checkIn,h.checkOut),0);

  const summary = `<div class="staysum">
    <div><span class="k">${U().bases}</span><span class="v">${core.length}</span></div>
    <div><span class="k">${U().nights}</span><span class="v">${nightsTotal}</span></div>
  </div>`;

  const cards = trip.hotels.map(h=>{
    const now = daysBetween(h.checkIn,t)>=0 && daysBetween(t,h.checkOut)>0;
    const nights = daysBetween(h.checkIn,h.checkOut);
    const pill = h.optional ? `<span class="pill ochre">${U().optional}</span>`
               : now ? `<span class="pill live">${U().today}</span>`
               : `<span class="pill">${nights} ${nights===1?U().night:U().nights}</span>`;
    const coords = `${h.coords[0].toFixed(4)}° N · ${h.coords[1].toFixed(4)}° E`;

    // Photo band on top; every practical detail stays below it on the light card.
    const band = h.photo ? `<div class="pband">
        <img src="${esc(h.photo)}" alt="${esc(h.name)}" loading="lazy">
        ${pill}
        <div class="pt">
          <div class="pk">${esc(tr(h.place))}</div>
          <h3>${esc(h.name)}</h3>
          <div class="pc">${coords}</div>
        </div>
      </div>` : "";

    const plainHead = h.photo ? "" : `<div class="hd"><div>
        <div class="eyebrow">${esc(tr(h.place))}</div>
        <h3 style="margin-top:4px">${esc(h.name)}</h3>
        <div class="mono" style="font-size:11px;color:var(--reef-dim);margin-top:5px">${coords}</div>
      </div>${pill}</div>`;

    return `<div class="card${h.photo?" photo":""}">
      ${band}
      <div class="${h.photo?"pbody":""}">
        ${plainHead}
        <div class="daterow">
          <span class="dt">${fmtDate(h.checkIn)}</span><span class="ar">&rarr;</span>
          <span class="dt">${fmtDate(h.checkOut)}</span>
          <span class="nn">${nights} ${nights===1?U().night:U().nights}</span>
        </div>
        <dl class="kv">
          ${h.room?`<dt>${U().room}</dt><dd>${esc(tr(h.room))}</dd>`:""}
          <dt>${U().phone}</dt><dd><a href="tel:${esc(h.phone).replace(/\s/g,"")}">${esc(h.phone)}</a></dd>
          <dt>${U().address}</dt><dd>${esc(h.address)}</dd>
        </dl>
        ${h.notes?`<p class="sub" style="margin-top:10px">${esc(tr(h.notes))}</p>`:""}
        <div class="row">
          <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener"
             href="${mapsUrl(h.name, h.address, h.coords, h.placeId)}">${U().directions}</a>
          <button class="btn ghost" data-goto="map" data-focus="${h.coords[0]},${h.coords[1]}">${U().showOnMap}</button>
        </div>
      </div>
    </div>`;
  }).join("");

  return `<div class="sectitle"><h2>${U().whereYouSleep}</h2><div class="rule"></div></div>`
       + summary + cards;
}

function viewDocs(){
  const cfg = trip.documents || {wallet:[],issued:[]};
  const req = cfg.wallet.filter(s=>s.required);
  const done = req.filter(s=>wallet[s.id]).length;
  const pct = req.length ? Math.round(done/req.length*100) : 0;

  const rows = cfg.wallet.map(s=>{
    const rec = wallet[s.id];
    const thumb = rec
      ? (rec.mime==="application/pdf" ? `<div class="thumb done">PDF</div>` : `<div class="thumb done"><img src="${rec.data}" alt=""></div>`)
      : `<div class="thumb">+</div>`;
    const added = rec ? new Date(rec.added).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
    return `<div class="doc">
      ${thumb}
      <div>
        <div class="l">${esc(tr(s.label))}${
          s.id === "contract" && trip.meta && trip.meta.contractRef
            ? ` <span class="mono" style="color:var(--ochre);font-weight:600">${esc(trip.meta.contractRef)}</span>` : ""
        }${s.required?` <span class="pill">${U().needed}</span>`:""}</div>
        <div class="s">${rec ? `<b>${U().saved_} ${added}</b> · ${Math.round(rec.bytes/1024)} KB` : esc(tr(s.hint))}</div>
        <div id="msg-${s.id}"></div>
      </div>
      <div class="docacts">
        ${rec ? `<button class="iconbtn" data-view="${s.id}" title="${U().view}">◉</button>
                 <button class="iconbtn" data-del="${s.id}" title="${U().remove}">✕</button>`
              : `<button class="btn ghost" data-add="${s.id}">${U().add}</button>`}
      </div></div>`;
  }).join("");

  /* Documents we issue. Trip-level entries (gov.pl country advice, the trip
     programme) are the same for everyone. Per-traveller entries — insurance,
     e-ticket, hotel voucher — come from that person's own record, so a link
     only ever appears for the person it belongs to. */
  const issuedList = (cfg.issued||[]).concat((traveller && traveller.docs) || []);
  const issued = issuedList.map(d=>`<div class="doc">
      <div class="thumb">${d.url?"↓":"—"}</div>
      <div><div class="l">${esc(tr(d.label))}</div><div class="s">${esc(tr(d.note))}</div></div>
      <div class="docacts">${d.url
        ? `<a class="btn ghost" style="text-decoration:none" href="${esc(d.url)}" target="_blank" rel="noopener">${U().open}</a>`
        : `<span class="pill">${U().notIssued}</span>`}</div>
    </div>`).join("");

  return `<div class="sectitle"><h2>${U().yourDocs}</h2><div class="rule"></div>
      <span class="pill ${done===req.length?"ok":"ochre"}">${done} / ${req.length} ${U().ready}</span></div>

  <div class="privacy">
    <div class="eyebrow">${U().docsStaysHere}</div>
    <p>${U().docsPrivacy}</p>
  </div>

  <div class="card">
    <div class="eyebrow">${U().packing}</div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="hair"></div>
    ${rows}
    <p class="note" style="margin-top:12px">${U().photoHint}</p>
  </div>

  <div class="sectitle"><h2>${U().fromMalakay}</h2><div class="rule"></div></div>
  <div class="card">${issued}
    <p class="note" style="margin-top:12px">${U().issuedNote}</p>
  </div>

  <input type="file" id="picker" class="hidden" accept="image/*,application/pdf">`;
}

/* ============================================================
   PASSPORT
   ------------------------------------------------------------
   An archive of every Malakay trip opened on this phone. It is
   the reason four trips had to move onto one web address: browser
   storage is tied to the origin, so separate sites could never
   have seen each other's history.

   Stored UNPREFIXED, unlike the dive log and gear ticks. Those
   belong to a departure; this belongs to the traveller.

   Nothing here is invented. A trip appears because it was opened;
   a dive appears because the traveller logged it. If the archive
   says eleven dives, eleven dives were written down.

   Never leaves the device. No server, no sync, no account — which
   is also why it needs no lawful basis and no retention rule.
   ============================================================ */

const PP_KEY = "malakay:passport";
let passport = {};
let ppQuery  = "";
let ppOpen   = null;

async function loadPassport(){
  try{
    const r = await window.storage.get(PP_KEY);
    if(r && r.value) passport = JSON.parse(r.value) || {};
  }catch(e){ passport = {}; }
}
async function savePassport(){
  try{ await window.storage.set(PP_KEY, JSON.stringify(passport)); }catch(e){}
}

/* Writes the current trip into the archive, then folds in whatever
   the traveller has logged. Runs on every open, so a corrected
   itinerary or a new dive is picked up without any action. */
async function recordPassport(){
  if(!trip || !trip.meta) return;
  const prev = passport[TRIP_ID] || {};
  passport[TRIP_ID] = {
    id: TRIP_ID,
    code: trip.meta.code || "",
    name: trip.meta.name,
    country: trip.meta.country,
    start: trip.meta.start,
    end: trip.meta.end,
    tz: trip.meta.tz,
    guide: (trip.meta.guide && trip.meta.guide.name) || "",
    bases: (trip.hotels || []).map(h => ({
      name: h.name, place: h.place, checkIn: h.checkIn, checkOut: h.checkOut, coords: h.coords
    })),
    sites: (trip.places || []).filter(p => p.type === "dive")
                              .map(p => ({ name: p.name, note: p.note, coords: p.coords })),
    towns: (trip.places || []).filter(p => p.type === "town")
                              .map(p => ({ name: p.name, note: p.note })),
    /* The day-by-day, kept so the archive can answer "what did we
       actually do on the Tuesday" years later. Titles and stops only:
       the long prose stays in the trip file, which is reachable any
       time the trip is opened again. */
    days: (trip.days || []).map(d => ({
      n: d.n, date: d.date, title: d.title, base: d.base,
      items: (d.items || []).map(it => (it && it[1]) ? it[1] : null).filter(Boolean)
    })),
    dives: diveLog.map(d => ({
      date: d.date, site: d.site, depth: d.depth, time: d.time,
      buddy: d.buddy, saw: d.saw, notes: d.notes
    })),
    firstOpened: prev.firstOpened || todayISO(),
    lastSeen: todayISO()
  };
  await savePassport();
}

const ppList = () => Object.values(passport)
  .sort((a,b) => String(b.start).localeCompare(String(a.start)));

function ppStats(){
  const trips = ppList();
  const dives = trips.flatMap(t => t.dives || []);
  const mins  = dives.reduce((a,d) => a + (parseFloat(d.time) || 0), 0);
  return {
    trips: trips.length,
    countries: new Set(trips.map(t => tr(t.country))).size,
    dives: dives.length,
    hours: Math.round(mins / 60),
    deepest: dives.reduce((a,d) => Math.max(a, parseFloat(d.depth) || 0), 0)
  };
}

/* Diacritics folded so "lodz" finds "Łódź" and an English keyboard
   still finds Polish entries. */
function ppNorm(s){
  return String(s == null ? "" : s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ł/g, "l");
}

function ppIndex(){
  const ix = [];
  const seen = new Set();
  ppList().forEach(t => {
    const c = tr(t.country);
    if(c && !seen.has("c|" + c)){
      seen.add("c|" + c);
      ix.push({type:"country", trip:t.id, label:c, hay:[ppNorm(t.country && t.country.pl), ppNorm(t.country && t.country.en)]});
    }
    ix.push({type:"trip", trip:t.id, label:tr(t.name),
             sub:`${c} · ${fmtDate(t.start)}`,
             hay:[ppNorm(t.name && t.name.pl), ppNorm(t.name && t.name.en), ppNorm(t.code)]});
    (t.dives || []).forEach(d => ix.push({type:"dive", trip:t.id, label:d.site,
             sub:[d.depth && d.depth + " m", d.time && d.time + " min", fmtDate(d.date)].filter(Boolean).join(" · "),
             hay:[ppNorm(d.site), ppNorm(d.saw), ppNorm(d.notes)]}));
    (t.sites || []).forEach(s => ix.push({type:"dive", trip:t.id, label:s.name,
             sub:`${c} · ${tr(s.note) || ""}`, hay:[ppNorm(s.name), ppNorm(tr(s.note))]}));
    (t.towns || []).forEach(s => ix.push({type:"place", trip:t.id, label:s.name,
             sub:`${c} · ${tr(s.note) || ""}`, hay:[ppNorm(s.name), ppNorm(tr(s.note))]}));
    (t.bases || []).forEach(b => ix.push({type:"place", trip:t.id, label:b.name,
             sub:`${tr(b.place)} · ${fmtDate(b.checkIn)}`, hay:[ppNorm(b.name), ppNorm(tr(b.place))]}));
    const people = new Set((t.dives || []).map(d => d.buddy).filter(Boolean));
    if(t.guide) people.add(t.guide);
    people.forEach(p => ix.push({type:"person", trip:t.id, label:p,
             sub:`${tr(t.name)} · ${String(t.start).slice(0,4)}`, hay:[ppNorm(p)]}));
  });
  return ix;
}

function ppSearch(q){
  const n = ppNorm(q).trim();
  if(!n) return [];
  const rank = {country:0, trip:1, dive:2, place:3, person:4};
  const out = [], seen = new Set();
  ppIndex().forEach(r => {
    let score = -1;
    r.hay.forEach(h => {
      if(!h) return;
      if(h.startsWith(n)) score = Math.max(score, 2);
      else if(h.includes(n)) score = Math.max(score, 1);
    });
    if(score < 0) return;
    /* One row per thing, not per trip. Michał guides every departure
       and the Coron wrecks appear on both Palawan trips; listing them
       once each keeps the results readable. ppIndex walks newest trip
       first, so the row that survives points at the most recent visit. */
    const k = r.type + "|" + ppNorm(r.label);
    if(seen.has(k)) return;
    seen.add(k);
    out.push({...r, score});
  });
  return out.sort((a,b) => b.score - a.score || rank[a.type] - rank[b.type]
                        || String(a.label).localeCompare(String(b.label))).slice(0, 30);
}

function ppMark(text, q){
  const s = String(text == null ? "" : text);
  const n = ppNorm(q).trim();
  if(!n) return esc(s);
  const i = ppNorm(s).indexOf(n);
  if(i < 0) return esc(s);
  return esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + n.length)) + "</mark>" + esc(s.slice(i + n.length));
}

function ppPhase(t){
  const today = todayISO();
  if(today < t.start) return {k:"upcoming", cls:""};
  if(today > t.end)   return {k:"past",     cls:"ok"};
  return {k:"current", cls:"ok"};
}

async function ppExport(){
  const blob = new Blob([JSON.stringify({schema:1, exported:todayISO(), trips:passport}, null, 2)],
                        {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "malakay-" + (lang === "pl" ? "paszport" : "passport") + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function ppImport(file){
  const P = U().passport;
  try{
    const data = JSON.parse(await file.text());
    const incoming = data && data.trips ? data.trips : data;
    let n = 0;
    Object.keys(incoming || {}).forEach(k => {
      const inc = incoming[k], cur = passport[k];
      /* Merge rather than replace: a trip already on this phone keeps
         whichever copy has more logged dives, so importing an older
         export can never delete a dive. */
      if(!cur || (inc.dives || []).length >= (cur.dives || []).length){
        passport[k] = inc; n++;
      }
    });
    await savePassport();
    alert(P.importOk + n);
    render();
  }catch(e){ alert(P.importBad); }
}
